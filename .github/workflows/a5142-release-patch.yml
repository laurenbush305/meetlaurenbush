name: A5.14.2 Release Patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a5142-release-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply release cache bust and media correction
        run: |
          python - <<'PY'
          from pathlib import Path

          release='a5142-20260831'

          p=Path('index.html')
          s=p.read_text()
          changes={
            'assets/css/a58-art-pass.css?v=a511-live-20260830':f'assets/css/a58-art-pass.css?v={release}',
            'assets/css/a5108-stardust-accessibility.css?v=a511-live-20260830':f'assets/css/a5108-stardust-accessibility.css?v={release}',
            'data-release-status="a511-live-visibility"':'data-release-status="a5142-design-pass"',
            'src="assets/img/a56/centerline-material.jpg"':'src="assets/img/activate-centerline-02.jpg"'
          }
          for old,new in changes.items():
            if old not in s:
              raise SystemExit(f'missing expected index token: {old}')
            s=s.replace(old,new)
          p.write_text(s)

          pages=['casting-sheet.html','project-scrambled-up.html','project-pickleball-bag.html','project-dear-diary-montis.html','project-honcho-centerline.html']
          for name in pages:
            p=Path(name)
            s=p.read_text()
            s=s.replace('href="assets/css/a58-art-pass.css"',f'href="assets/css/a58-art-pass.css?v={release}"')
            if name=='project-honcho-centerline.html':
              s=s.replace('src="assets/img/a56/centerline-material.jpg"','src="assets/img/activate-centerline-02.jpg"')
            p.write_text(s)
          PY
          git diff --check
      - name: Commit A5.14.2 release
        run: |
          if git diff --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html casting-sheet.html project-*.html
          git commit -m 'Publish A5.14.2 design release'
          git push
