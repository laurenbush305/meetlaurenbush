name: A5.8 Release Smoke

on:
  push:
    branches: [build/a58-production]
  workflow_dispatch:

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser tooling
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 4173 >/tmp/seasonzero-smoke.log 2>&1 &
          sleep 2
      - name: Booking + keyboard smoke
        run: |
          cat > /tmp/a58-release-smoke.cjs <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});

            const homeMailtos = await page.locator('a[href^="mailto:hello@meetlaurenbush.com"]').evaluateAll(nodes => nodes.map(a => a.getAttribute('href')));
            assert(homeMailtos.length >= 3, 'Homepage must expose multiple direct booking routes');
            assert(homeMailtos.every(href => href.startsWith('mailto:hello@meetlaurenbush.com')), 'Every homepage booking route must use the booking inbox');

            const proofTrigger = page.locator('.proof-index-trigger').first();
            await proofTrigger.focus();
            await page.keyboard.press('Enter');
            assert.strictEqual(await page.locator('#proof-index').getAttribute('aria-hidden'),'false','Proof drawer should open from keyboard');
            await page.keyboard.press('Escape');
            assert.strictEqual(await page.locator('#proof-index').getAttribute('aria-hidden'),'true','Proof drawer should close with Escape');

            const firstWatch = page.locator('[data-watch]').first();
            await firstWatch.focus();
            await page.keyboard.press('ArrowRight');
            const selected = await page.locator('[data-watch][aria-selected="true"]').count();
            assert.strictEqual(selected,1,'Watch must keep one selected tab during keyboard tuning');
            await page.keyboard.press('Home');
            assert.strictEqual(await page.locator('[data-watch]').first().getAttribute('aria-selected'),'true','Home should return Watch to first tab');
            await page.keyboard.press('End');
            assert.strictEqual(await page.locator('[data-watch]').last().getAttribute('aria-selected'),'true','End should move Watch to last tab');

            await page.goto('http://127.0.0.1:4173/casting-sheet.html',{waitUntil:'networkidle'});
            const castMailtos = await page.locator('a[href^="mailto:hello@meetlaurenbush.com"]').evaluateAll(nodes => nodes.map(a => a.getAttribute('href')));
            assert(castMailtos.length >= 2,'Casting Sheet must expose direct booking routes');
            assert(castMailtos.every(href => href.startsWith('mailto:hello@meetlaurenbush.com')),'Every Casting Sheet booking route must use the booking inbox');

            assert.strictEqual(errors.length,0,'No page errors during release smoke');
            await browser.close();
            console.log(JSON.stringify({homeBookingRoutes:homeMailtos.length,castingBookingRoutes:castMailtos.length,proofKeyboard:true,watchKeyboard:true,pageErrors:errors},null,2));
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/a58-release-smoke.cjs
