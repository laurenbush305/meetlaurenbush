name: A5.14.3 Release Patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/a5143-release-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply A5.14.3 release
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          old='a5142-20260831'
          new='a5143-20260831'

          p=Path('index.html')
          s=p.read_text()
          if old not in s or 'data-release-status="a5142-design-pass"' not in s:
              raise SystemExit('A5.14.2 homepage release tokens not found')
          s=s.replace(old,new)
          s=s.replace('data-release-status="a5142-design-pass"','data-release-status="a5143-design-pass"')
          s,n=re.subn(r'\s*<figure class="activate-material">.*?</figure>','',s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('activate-material figure was not removed exactly once')
          p.write_text(s)

          pages=['casting-sheet.html','project-scrambled-up.html','project-pickleball-bag.html','project-dear-diary-montis.html','project-honcho-centerline.html']
          for name in pages:
              p=Path(name)
              s=p.read_text().replace(old,new)
              if name=='project-honcho-centerline.html':
                  s=s.replace('assets/img/activate-centerline-02.jpg','assets/img/a5103/activate-centerline-wide-1080.jpg')
              p.write_text(s)
          PY
          git diff --check
      - name: Commit A5.14.3 release
        run: |
          if git diff --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html casting-sheet.html project-*.html
          git commit -m 'Publish A5.14.3 design release'
          git push
