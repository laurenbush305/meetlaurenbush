name: A5.19 Calibration Release Patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch A5.19 public marker and cache key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          if 'a5190-warm-prismatic-calibration' in s:
              print('A5.19 calibration marker already present')
              raise SystemExit(0)
          css = Path('assets/css/a519-warm-prismatic-stardust.css')
          if not css.exists():
              print('A5.19 stylesheet not present yet; no release patch')
              raise SystemExit(0)
          old_link = 'assets/css/a58-art-pass.css?v=a5162-20260831'
          new_link = 'assets/css/a58-art-pass.css?v=a5190-20260831'
          old_marker = 'data-release-status="a5162-proof-closure"'
          new_marker = 'data-release-status="a5190-warm-prismatic-calibration"'
          if old_link not in s or old_marker not in s:
              raise SystemExit('Expected A5.16.2 release strings not found; refusing broad patch')
          s = s.replace(old_link, new_link, 1)
          s = s.replace(old_marker, new_marker, 1)
          p.write_text(s)
          PY
      - name: Commit release marker
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No release patch needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Publish A5.19 Warm Prismatic calibration'
          git push
