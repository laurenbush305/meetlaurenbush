name: A5.19.5 One-Shot Visual Capture

on:
  push:
    branches: [main]
    paths:
      - '.capture-a5195'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: |
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps chromium
      - name: Capture current live page with A5.19.5 optical layer
        run: |
          mkdir -p capture
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const configs = [
            ['desktop',1440,1000],
            ['tablet',768,1024],
            ['mobile',390,844]
          ];
          for (const [name,width,height] of configs) {
            const page = await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
            await page.goto('https://meetlaurenbush.com/?a5195='+Date.now(),{waitUntil:'networkidle',timeout:120000});
            await page.addStyleTag({url:'https://meetlaurenbush.com/assets/css/a5195-aura-elevation.css?fresh='+Date.now()});
            await page.waitForTimeout(1200);
            await page.locator('.hero').screenshot({path:`capture/${name}-hero.png`});
            await page.locator('#person').scrollIntoViewIfNeeded();
            await page.waitForTimeout(900);
            await page.locator('#person').screenshot({path:`capture/${name}-person.png`});
            await page.close();
          }
          await browser.close();
          EOF
          node capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a5195-visual-capture
          path: capture
          if-no-files-found: warn
