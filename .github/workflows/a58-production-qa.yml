name: A5.8 Production Browser QA

on:
  push:
    branches: [build/a58-production]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Public media guard
        run: |
          ! grep -Eqi 'review-candidate|YellowSweater|GraffitiFullBody|presenter-rooftop|Bentley|BlackWomenInvest|BlackStool|StudioLeather|FloralDress' index.html
          ! grep -Eqi 'White Claw' index.html
      - name: Install browser tooling
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/seasonzero-server.log 2>&1 &
          sleep 2
      - name: Run six-width production gate
        run: |
          mkdir -p qa-artifacts
          cat > /tmp/a58-production-qa.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const widths = [1440,1024,768,430,390,360];
          const heights = {1440:900,1024:900,768:900,430:932,390:844,360:800};
          const money = [['hero','.hero'],['person','#person'],['explain','#explain'],['create','#create'],['television','#television']];
          const sleep = ms => new Promise(r => setTimeout(r,ms));
          async function hydrate(page){await page.evaluate(async()=>{const wait=ms=>new Promise(r=>setTimeout(r,ms));[...document.images].forEach(img=>img.loading='eager');const step=Math.max(500,Math.floor(innerHeight*.8));for(let y=0;y<document.documentElement.scrollHeight;y+=step){scrollTo(0,y);await wait(55)}scrollTo(0,0);await wait(120);await Promise.all([...document.images].map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,3000)})));});}
          async function inspect(page){return page.evaluate(async()=>{const de=document.documentElement;const ids=[...document.querySelectorAll('[id]')].map(e=>e.id);const probe=await new Promise(resolve=>{const i=new Image();i.onload=()=>resolve({ok:true,w:i.naturalWidth,h:i.naturalHeight});i.onerror=()=>resolve({ok:false,w:0,h:0});i.src='assets/img/a55/wimpb-campaign-main.jpg?qa='+Date.now()});return {sw:de.scrollWidth,cw:de.clientWidth,broken:[...document.images].filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.getAttribute('src')),missingAlt:[...document.images].filter(i=>!i.hasAttribute('alt')).map(i=>i.getAttribute('src')),duplicateIds:[...new Set(ids.filter((x,i)=>ids.indexOf(x)!==i))],h1:document.querySelectorAll('h1').length,unnamedButtons:[...document.querySelectorAll('button')].filter(b=>!(b.innerText.trim()||b.getAttribute('aria-label'))).length,emptyLinks:[...document.querySelectorAll('a')].filter(a=>!(a.innerText.trim()||a.getAttribute('aria-label'))).length,wimpb:probe,order:[...document.querySelectorAll('main>section')].map(s=>s.id||s.className.split(' ')[0])};});}
          (async()=>{const browser=await chromium.launch({headless:true});const results={};let failed=false;for(const width of widths){const page=await browser.newPage({viewport:{width,height:heights[width]}});const pageErrors=[],consoleErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});await hydrate(page);const data=await inspect(page);data.overflow=data.sw>data.cw;data.pageErrors=pageErrors;data.consoleErrors=consoleErrors;data.firstFiveOk=['hero','person','explain','create','television'].every((v,i)=>data.order[i]===v);data.nativeWimpb=data.wimpb.ok&&data.wimpb.w===480&&data.wimpb.h===854;results[width]=data;if(data.overflow||data.broken.length||data.missingAlt.length||data.duplicateIds.length||data.h1!==1||data.unnamedButtons||data.emptyLinks||pageErrors.length||consoleErrors.length||!data.firstFiveOk||!data.nativeWimpb)failed=true;await page.screenshot({path:`qa-artifacts/home-${width}.png`,fullPage:true});if(width===1440||width===390){for(const [name,sel] of money){const loc=page.locator(sel).first();if(await loc.count()){await loc.scrollIntoViewIfNeeded();await sleep(100);await loc.screenshot({path:`qa-artifacts/${name}-${width}.png`})}}}await page.close();}fs.writeFileSync('qa-artifacts/results.json',JSON.stringify(results,null,2));console.log(JSON.stringify(results,null,2));await browser.close();if(failed)process.exit(1);})();
          NODE
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/a58-production-qa.cjs
      - name: Upload QA screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a58-production-qa
          path: qa-artifacts/
