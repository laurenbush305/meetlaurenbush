name: A5.8 Production Browser QA

on:
  push:
    branches: [build/a58-production]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Public media guard
        run: |
          ! grep -Eqi 'review-candidate|YellowSweater|GraffitiFullBody|presenter-rooftop|Bentley|BlackWomenInvest|BlackStool|StudioLeather|FloralDress|Trivia host training' index.html casting-sheet.html
          ! grep -Eqi 'White Claw' index.html casting-sheet.html
          grep -Fq 'Selected promotional content later supported by paid amplification.' index.html
          grep -Fq 'Selected promotional content later supported by paid amplification.' casting-sheet.html
          grep -Fq 'assets/css/casting-a58.css' casting-sheet.html
      - name: Install browser tooling
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/seasonzero-server.log 2>&1 &
          sleep 2
      - name: Run six-width production gate
        run: |
          mkdir -p qa-artifacts
          cat > /tmp/a58-production-qa.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const widths = [1440,1024,768,430,390,360];
          const heights = {1440:900,1024:900,768:900,430:932,390:844,360:800};
          const sequence = ['hero','person','explain','create','television','host','activate','watch','trust','imagination','book'];
          const homeMoney = sequence.map(name => [name, name === 'hero' ? '.hero' : `#${name}`]);
          const castMoney = [['casting-hero','.casting-hero'],['casting-doors','.door-section'],['casting-proof','.proof-section'],['casting-operator','.operator-section'],['casting-booking','.booking-section']];
          const sleep = ms => new Promise(r => setTimeout(r,ms));
          async function hydrate(page){await page.evaluate(async()=>{const wait=ms=>new Promise(r=>setTimeout(r,ms));[...document.images].forEach(img=>img.loading='eager');const step=Math.max(500,Math.floor(innerHeight*.8));for(let y=0;y<document.documentElement.scrollHeight;y+=step){scrollTo(0,y);await wait(45)}scrollTo(0,0);await wait(120);await Promise.all([...document.images].map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,3000)})));});}
          async function blur(page){await page.evaluate(()=>{if(document.activeElement&&typeof document.activeElement.blur==='function')document.activeElement.blur()});await sleep(40);}
          async function exerciseWatch(page){const names=['scrambled','wimpb','montis','apq','archive'];let ok=true;for(const name of names){const tab=page.locator(`[data-watch="${name}"]`);await tab.click();await sleep(55);const state=await page.evaluate(n=>{const tab=document.querySelector(`[data-watch="${n}"]`);const panel=document.querySelector(`[data-watch-panel="${n}"]`);return !!tab&&!!panel&&tab.getAttribute('aria-selected')==='true'&&!panel.hidden&&panel.classList.contains('active')},name);if(!state)ok=false;}await page.locator('[data-watch="scrambled"]').click();await blur(page);return ok;}
          async function inspectCommon(page){return page.evaluate(()=>{const de=document.documentElement;const ids=[...document.querySelectorAll('[id]')].map(e=>e.id);return {sw:de.scrollWidth,cw:de.clientWidth,broken:[...document.images].filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.getAttribute('src')),missingAlt:[...document.images].filter(i=>!i.hasAttribute('alt')).map(i=>i.getAttribute('src')),duplicateIds:[...new Set(ids.filter((x,i)=>ids.indexOf(x)!==i))],h1:document.querySelectorAll('h1').length,unnamedButtons:[...document.querySelectorAll('button')].filter(b=>!(b.innerText.trim()||b.getAttribute('aria-label'))).length,emptyLinks:[...document.querySelectorAll('a')].filter(a=>!(a.innerText.trim()||a.getAttribute('aria-label'))).length,bookingLinks:[...document.querySelectorAll('a[href^="mailto:hello@meetlaurenbush.com"]')].length};});}
          async function probeWimpb(page){return page.evaluate(()=>new Promise(resolve=>{const i=new Image();i.onload=()=>resolve({ok:true,w:i.naturalWidth,h:i.naturalHeight});i.onerror=()=>resolve({ok:false,w:0,h:0});i.src='assets/img/a55/wimpb-campaign-main.jpg?qa='+Date.now()}));}
          async function runPage(browser,{path,label,money,home=false}){const pageResults={};let pageFailed=false;for(const width of widths){const page=await browser.newPage({viewport:{width,height:heights[width]}});const pageErrors=[],consoleErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});await page.goto(`http://127.0.0.1:4173/${path}`,{waitUntil:'networkidle'});await hydrate(page);let watchInteractive=true;if(home)watchInteractive=await exerciseWatch(page);const data=await inspectCommon(page);data.overflow=data.sw>data.cw;data.pageErrors=pageErrors;data.consoleErrors=consoleErrors;data.watchInteractive=watchInteractive;if(home){const extra=await page.evaluate(()=>({order:[...document.querySelectorAll('main>section')].map(s=>s.id||s.className.split(' ')[0]),backHalfCss:!!document.querySelector('link[href="assets/css/lbtv-back-half.css"]'),watchJs:!!document.querySelector('script[src="assets/js/lbtv-back-half.js"]'),gateEndGone:!document.querySelector('.gate-end'),bookEmail:document.querySelectorAll('#book a[href^="mailto:hello@meetlaurenbush.com"]').length>0}));Object.assign(data,extra);data.sequenceOk=sequence.every((v,i)=>data.order[i]===v)&&data.order.length===sequence.length;data.wimpb=await probeWimpb(page);data.nativeWimpb=data.wimpb.ok&&data.wimpb.w===480&&data.wimpb.h===854;}else{const extra=await page.evaluate(()=>({castingCss:!!document.querySelector('link[href="assets/css/casting-a58.css"]'),homeCss:!!document.querySelector('link[href="assets/css/lbtv-main.css"]'),sections:['.casting-hero','.door-section','.proof-section','.operator-section','.booking-section'].every(s=>!!document.querySelector(s)),publicQualifier:document.body.innerText.includes('Selected promotional content later supported by paid amplification.'),directEmail:document.body.innerText.includes('hello@meetlaurenbush.com')}));Object.assign(data,extra);}const commonFail=data.overflow||data.broken.length||data.missingAlt.length||data.duplicateIds.length||data.h1!==1||data.unnamedButtons||data.emptyLinks||pageErrors.length||consoleErrors.length||data.bookingLinks<1;const specificFail=home?(!data.sequenceOk||!data.nativeWimpb||!watchInteractive||!data.backHalfCss||!data.watchJs||!data.gateEndGone||!data.bookEmail):(!data.castingCss||!data.homeCss||!data.sections||!data.publicQualifier||!data.directEmail);if(commonFail||specificFail)pageFailed=true;pageResults[width]=data;await blur(page);await page.screenshot({path:`qa-artifacts/${label}-${width}.png`,fullPage:true});if(width===1440||width===390){for(const [name,sel] of money){const loc=page.locator(sel).first();if(await loc.count()){await loc.scrollIntoViewIfNeeded();await blur(page);await loc.screenshot({path:`qa-artifacts/${name}-${width}.png`})}}}await page.close();}return {results:pageResults,failed:pageFailed};}
          (async()=>{const browser=await chromium.launch({headless:true});const home=await runPage(browser,{path:'index.html',label:'home',money:homeMoney,home:true});const casting=await runPage(browser,{path:'casting-sheet.html',label:'casting',money:castMoney,home:false});const results={home:home.results,casting:casting.results};fs.writeFileSync('qa-artifacts/results.json',JSON.stringify(results,null,2));console.log(JSON.stringify(results,null,2));await browser.close();if(home.failed||casting.failed)process.exit(1);})();
          NODE
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/a58-production-qa.cjs
      - name: Upload QA screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a58-production-qa
          path: qa-artifacts/
