name: A5.10.2 Performance Guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  responsive-asset-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate responsive hero delivery
        run: |
          set -euo pipefail
          test -f assets/img/a5102/blue-skirt-480.webp
          test -f assets/img/a5102/blue-skirt-720.webp
          test -f assets/img/a5102/blue-skirt-960.webp
          test -f assets/img/a5102/blue-skirt-1122.webp
          test -f assets/img/a5102/host-talent-160.webp
          test -f assets/img/a5102/host-talent-320.webp
          test -f assets/img/a5102/host-talent-540.webp

          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          assert 'rel="preload" as="image" href="assets/img/a55/blue-skirt-approved.png"' not in html
          assert 'assets/img/a5102/blue-skirt-480.webp 480w' in html
          assert 'assets/img/a5102/blue-skirt-720.webp 720w' in html
          assert 'assets/img/a5102/blue-skirt-960.webp 960w' in html
          assert 'assets/img/a5102/blue-skirt-1122.webp 1122w' in html
          assert 'assets/img/a55/blue-skirt-approved.png' in html
          assert 'fetchpriority="high"' in html
          assert 'decoding="async"' in html
          PY

          original=$(stat -c%s assets/img/a55/blue-skirt-approved.png)
          mobile=$(stat -c%s assets/img/a5102/blue-skirt-720.webp)
          highdpi=$(stat -c%s assets/img/a5102/blue-skirt-960.webp)
          desktop=$(stat -c%s assets/img/a5102/blue-skirt-1122.webp)

          test "$original" -gt 1500000
          test "$mobile" -lt 150000
          test "$highdpi" -lt 200000
          test "$desktop" -lt 250000

          echo "Original hero: $original bytes"
          echo "720w hero: $mobile bytes"
          echo "960w hero: $highdpi bytes"
          echo "1122w hero: $desktop bytes"
