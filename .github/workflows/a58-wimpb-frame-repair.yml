name: A5.8 WIMPB Source Frame Repair

on:
  push:
    branches: [build/a58-production]
    paths:
      - .github/workflows/a58-wimpb-frame-repair.yml

permissions:
  contents: write

jobs:
  repair-poster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/a58-production
          fetch-depth: 0
      - name: Extract verified native frame from source video
        run: |
          ffmpeg -y -ss 76 -i assets/video/explain-pickleball-bag-web.mp4 -frames:v 1 -q:v 4 assets/img/a55/wimpb-campaign-main.jpg
          python3 - <<'PY'
          from PIL import Image
          p='assets/img/a55/wimpb-campaign-main.jpg'
          with Image.open(p) as im:
              assert im.size == (480, 854), im.size
              print('verified dimensions:', im.size)
          PY
      - name: Commit verified poster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/a55/wimpb-campaign-main.jpg
          if git diff --cached --quiet; then
            echo "Poster already matches extracted source frame."
            exit 0
          fi
          git commit -m "Regenerate WIMPB poster from verified source frame"
          git push origin HEAD:build/a58-production
