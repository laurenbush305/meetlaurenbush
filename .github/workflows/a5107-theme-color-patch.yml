name: A5.10.7 One-Time Theme Color Patch

on:
  push:
    branches:
      - 'fix/a5107-accessible-signal-palette'

permissions:
  contents: write

jobs:
  patch-theme-color:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace stale warm browser theme color
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = '<meta name="theme-color" content="#f8f2e8">'
          new = '<meta name="theme-color" content="#0bbcd0">'
          if old in text:
              assert text.count(old) == 1
              path.write_text(text.replace(old, new))
              print('Updated theme color to canonical pool aqua.')
          else:
              assert new in text, 'Expected old or new theme-color not found.'
              print('Theme color already corrected.')
          PY
      - name: Commit branch-only theme color correction
        run: |
          if git diff --quiet -- index.html; then
            echo 'No theme color change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Correct Season Zero browser theme color'
          git push
