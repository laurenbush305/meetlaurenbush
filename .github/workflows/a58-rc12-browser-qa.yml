name: A5.8 RC1.2 Browser QA

on:
  push:
    branches: [build/a58-rc12-candidate]
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start site
        run: |
          python3 -m http.server 4173 >/tmp/site.log 2>&1 &
          sleep 2
      - name: Run six-width QA
        run: |
          mkdir -p qa-artifacts
          cat > /tmp/qa.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const widths=[1440,1024,768,430,390,360];
          const heights={1440:900,1024:900,768:900,430:932,390:844,360:800};
          async function scrollAll(page){
            await page.evaluate(async()=>{for(let y=0;y<document.body.scrollHeight;y+=500){scrollTo(0,y);await new Promise(r=>setTimeout(r,35));}scrollTo(0,0);});
            await page.waitForTimeout(500);
          }
          async function inspect(page){
            return await page.evaluate(()=>{
              const de=document.documentElement,ids=[...document.querySelectorAll('[id]')].map(e=>e.id);
              return {sw:de.scrollWidth,cw:de.clientWidth,broken:[...document.images].filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.getAttribute('src')),unloaded:[...document.images].filter(i=>!i.complete).map(i=>i.getAttribute('src')),missingAlt:[...document.images].filter(i=>!i.hasAttribute('alt')).map(i=>i.getAttribute('src')),duplicateIds:[...new Set(ids.filter((x,i)=>ids.indexOf(x)!==i))],h1:document.querySelectorAll('h1').length,unnamedButtons:[...document.querySelectorAll('button')].filter(b=>!(b.innerText.trim()||b.getAttribute('aria-label'))).length,emptyLinks:[...document.querySelectorAll('a')].filter(a=>!(a.innerText.trim()||a.getAttribute('aria-label'))).length};
            });
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});let failed=false;const results={};
            for(const width of widths){
              const page=await browser.newPage({viewport:{width,height:heights[width]}});const pageErrors=[],consoleErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e)));page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});await scrollAll(page);
              const tabs=page.locator('.watch-tuner button');if(await tabs.count()>1){await tabs.nth(1).click();await page.waitForTimeout(250);await tabs.nth(0).click();}
              const data=await inspect(page);data.overflow=data.sw>data.cw;data.pageErrors=pageErrors;data.consoleErrors=consoleErrors;results[`home-${width}`]=data;
              if(data.overflow||data.broken.length||data.unloaded.length||data.missingAlt.length||data.duplicateIds.length||data.h1!==1||data.unnamedButtons||data.emptyLinks||pageErrors.length||consoleErrors.length)failed=true;
              await page.screenshot({path:`qa-artifacts/home-${width}.png`,fullPage:true});
              const trust=page.locator('#trust');if((width===1440||width===390)&&await trust.count()){await trust.scrollIntoViewIfNeeded();await trust.screenshot({path:`qa-artifacts/trust-${width}.png`});}
              await page.goto('http://127.0.0.1:4173/casting-sheet.html',{waitUntil:'networkidle'});await scrollAll(page);const cast=await inspect(page);cast.overflow=cast.sw>cast.cw;results[`casting-${width}`]=cast;
              if(cast.overflow||cast.broken.length||cast.unloaded.length||cast.missingAlt.length||cast.duplicateIds.length||cast.h1!==1||cast.unnamedButtons||cast.emptyLinks)failed=true;
              if(width===1440||width===390)await page.screenshot({path:`qa-artifacts/casting-${width}.png`,fullPage:true});
              await page.close();
            }
            fs.writeFileSync('qa-artifacts/results.json',JSON.stringify(results,null,2));console.log(JSON.stringify(results,null,2));await browser.close();if(failed)process.exit(1);
          })();
          NODE
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/qa.cjs
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a58-rc12-browser-qa
          path: qa-artifacts/
