name: A5.11 Live Render QA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  live-render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Wait for A5.11 on public domain
        run: |
          for i in $(seq 1 24); do
            if curl -fsSL --max-time 15 'https://meetlaurenbush.com/?qa=a511' | grep -q 'a511-live-visibility'; then
              echo 'A5.11 is live.'
              exit 0
            fi
            echo "Waiting for GitHub Pages deployment ($i/24)..."
            sleep 10
          done
          echo 'Timed out waiting for A5.11 public marker.' >&2
          exit 1

      - name: Render live production
        run: |
          cat > /tmp/a511-live.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('qa-artifacts/a511-live', {recursive:true});
          const failures=[];
          const browser=await chromium.launch({headless:true});

          async function render(width,height,label){
            const ctx=await browser.newContext({viewport:{width,height},deviceScaleFactor:1,colorScheme:'light'});
            const page=await ctx.newPage();
            const bad=[];
            page.on('console',m=>{if(m.type()==='error') bad.push(`console: ${m.text()}`)});
            page.on('pageerror',e=>bad.push(`pageerror: ${e.message}`));
            const res=await page.goto(`https://meetlaurenbush.com/?qa=a511-${Date.now()}`,{waitUntil:'networkidle',timeout:60000});
            if(!res || !res.ok()) failures.push(`${label}: HTTP ${res?.status()}`);
            await page.waitForTimeout(1000);
            const marker=await page.locator('body').getAttribute('data-release-status');
            if(marker!=='a511-live-visibility') failures.push(`${label}: stale marker ${marker}`);

            const nav=page.locator('.topbar');
            const navBox=await nav.boundingBox();
            const sections=[
              ['television','.television','#tv-title'],
              ['host','.host','#host-title'],
              ['trust','.trust','#trust-title'],
              ['imagination','.imagination','#imagination-title']
            ];
            for(const [name,sectionSel,titleSel] of sections){
              await page.locator(sectionSel).scrollIntoViewIfNeeded();
              await page.waitForTimeout(550);
              const title=page.locator(titleSel);
              const tb=await title.boundingBox();
              const text=(await title.innerText()).trim();
              if(navBox && tb && tb.y < navBox.height + 12) failures.push(`${label}-${name}: title under nav y=${tb.y.toFixed(1)} nav=${navBox.height.toFixed(1)}`);
              if(name==='television' && text!=='Scrambled Up') failures.push(`${label}: television title text=${text}`);
              if(name==='trust' && text!=='Between cues') failures.push(`${label}: trust title text=${text}`);
              await page.locator(sectionSel).screenshot({path:`qa-artifacts/a511-live/${label}-${name}.png`});
            }

            // Verify the live image sources and fitted crop rules for the exact problem areas.
            const imageState=await page.evaluate(()=>{
              const read=(sel)=>{const el=document.querySelector(sel); if(!el)return null; const cs=getComputedStyle(el); return {src:el.currentSrc||el.src,fit:cs.objectFit,pos:cs.objectPosition,rect:el.getBoundingClientRect().toJSON?.()||{x:el.getBoundingClientRect().x,y:el.getBoundingClientRect().y,width:el.getBoundingClientRect().width,height:el.getBoundingClientRect().height}}};
              return {
                tvPortrait:read('.tv-portrait img'),
                tvDetail:read('.tv-detail img'),
                archive:read('.tv-archive-flash img'),
                host:read('.host-environment img'),
                trust:read('.trust-photo img')
              };
            });
            if(!imageState.trust?.src.includes('host-celsius-main-a52')) failures.push(`${label}: Between cues still uses wrong image ${imageState.trust?.src}`);
            if(imageState.archive?.fit!=='contain') failures.push(`${label}: archive fit=${imageState.archive?.fit}`);
            for(const k of ['tvPortrait','tvDetail','host','trust']){
              if(!imageState[k]) failures.push(`${label}: missing ${k}`);
              else if(!imageState[k].pos.toLowerCase().includes('top') && imageState[k].pos!=='50% 0%') failures.push(`${label}: ${k} object-position=${imageState[k].pos}`);
            }
            fs.writeFileSync(`qa-artifacts/a511-live/${label}-state.json`,JSON.stringify({marker,imageState,bad},null,2));
            await page.evaluate(()=>window.scrollTo(0,0));
            await page.waitForTimeout(300);
            await page.screenshot({path:`qa-artifacts/a511-live/${label}-full.png`,fullPage:true});
            if(bad.length) failures.push(...bad.map(x=>`${label}: ${x}`));
            await ctx.close();
          }

          await render(1440,1000,'desktop-1440');
          await render(390,844,'mobile-390');
          await browser.close();
          fs.writeFileSync('qa-artifacts/a511-live/failures.json',JSON.stringify(failures,null,2));
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          JS
          node /tmp/a511-live.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a511-live-render
          path: qa-artifacts/a511-live
          if-no-files-found: error
