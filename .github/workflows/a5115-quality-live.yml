name: A5.11.5 Media Fix Live QA
on:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Wait for A5.11.5
        run: |
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 15 "https://meetlaurenbush.com/assets/css/a58-art-pass.css?qa=a5115-$i" | grep -q 'a5115-quality'; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Render corrected media
        run: |
          cat > qa.mjs <<'JS'
          import {chromium} from 'playwright'; import fs from 'node:fs';
          fs.mkdirSync('qa-artifacts/a5115',{recursive:true}); const failures=[]; const b=await chromium.launch({headless:true});
          for(const [label,path] of [['pickleball','/project-pickleball-bag.html'],['centerline','/project-honcho-centerline.html'],['casting','/casting-sheet.html']]){
            for(const [mode,w,h] of [['desktop',1440,1000],['mobile',390,844]]){
              const c=await b.newContext({viewport:{width:w,height:h},colorScheme:'light'}); const p=await c.newPage();
              const r=await p.goto(`https://meetlaurenbush.com${path}?qa=a5115-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000}); if(!r?.ok()) failures.push(`${label}-${mode} HTTP ${r?.status()}`);
              await p.waitForTimeout(800); await p.evaluate(async()=>{for(let y=0;y<document.documentElement.scrollHeight;y+=600){scrollTo(0,y);await new Promise(r=>setTimeout(r,60));}}); await p.waitForTimeout(500);
              let state={};
              if(label==='pickleball') state=await p.evaluate(()=>{const m=document.querySelector('.project-hero-media'),i=m.querySelector('img'),v=document.querySelector('.evidence-media video'); const mr=m.getBoundingClientRect(),vr=v.getBoundingClientRect(); return {heroWidth:mr.width,heroFit:getComputedStyle(i).objectFit,videoWidth:vr.width,scrollWidth:document.documentElement.scrollWidth}});
              if(label==='centerline') state=await p.evaluate(()=>{const i=document.querySelector('.evidence-media img'); const s=getComputedStyle(i); return {content:s.content,fit:s.objectFit,pos:s.objectPosition,scrollWidth:document.documentElement.scrollWidth}});
              if(label==='casting') state=await p.evaluate(()=>{const i=document.querySelector('.operator-photo img');return {content:getComputedStyle(i).content,scrollWidth:document.documentElement.scrollWidth}});
              if(label==='pickleball'&&mode==='desktop'&&state.heroWidth>482) failures.push(`pickleball desktop hero too wide ${state.heroWidth}`);
              if(label==='pickleball'&&mode==='mobile'&&state.heroWidth>342) failures.push(`pickleball mobile hero too wide ${state.heroWidth}`);
              if(label==='pickleball'&&state.heroFit!=='contain') failures.push(`pickleball ${mode} hero fit ${state.heroFit}`);
              if(label==='centerline'&&!state.content.includes('activate-room.jpg')) failures.push(`centerline ${mode} still old evidence ${state.content}`);
              if(label==='casting'&&!state.content.includes('host-celsius-main-a52.jpg')) failures.push(`casting ${mode} lost Lauren operator image`);
              if(state.scrollWidth>w+2) failures.push(`${label}-${mode} horizontal overflow ${state.scrollWidth}`);
              fs.writeFileSync(`qa-artifacts/a5115/${label}-${mode}-state.json`,JSON.stringify(state,null,2));
              await p.addStyleTag({content:'.topbar{position:absolute!important;top:0!important}'}); await p.screenshot({path:`qa-artifacts/a5115/${label}-${mode}.png`,fullPage:true});
              if(label==='pickleball') await p.locator('.project-hero').screenshot({path:`qa-artifacts/a5115/${label}-${mode}-hero.png`});
              if(label==='centerline') await p.locator('.project-evidence').screenshot({path:`qa-artifacts/a5115/${label}-${mode}-evidence.png`});
              await c.close();
            }
          }
          await b.close(); fs.writeFileSync('qa-artifacts/a5115/failures.json',JSON.stringify(failures,null,2)); if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          JS
          node qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a5115-live-media
          path: qa-artifacts/a5115
