name: A5.12 Between Cues Live QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Wait for A5.12 on public domain
        run: |
          for i in $(seq 1 36); do
            if curl -fsSL --max-time 15 "https://meetlaurenbush.com/assets/css/a58-art-pass.css?qa=a512-$i" | grep -q 'a512-between-cues'; then
              echo 'A5.12 is live.'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for A5.12.' >&2
          exit 1
      - name: Render Between cues
        run: |
          cat > a512.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('qa-artifacts/a512',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const failures=[];
          for(const [mode,width,height] of [['desktop',1440,1000],['mobile',390,844]]){
            const ctx=await browser.newContext({viewport:{width,height},colorScheme:'light'});
            const page=await ctx.newPage();
            const res=await page.goto(`https://meetlaurenbush.com/?qa=a512-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            if(!res?.ok()) failures.push(`${mode}: HTTP ${res?.status()}`);
            await page.locator('#trust').scrollIntoViewIfNeeded();
            await page.waitForTimeout(900);
            const state=await page.evaluate(()=>{
              const section=document.querySelector('#trust');
              const figure=document.querySelector('.trust-photo');
              const img=figure.querySelector('img');
              const proof=document.querySelector('.trust-proof');
              const sr=section.getBoundingClientRect(), fr=figure.getBoundingClientRect(), pr=proof.getBoundingClientRect();
              const ic=getComputedStyle(img);
              return {viewport:innerWidth,scrollWidth:document.documentElement.scrollWidth,section:{w:sr.width,h:sr.height},photo:{w:fr.width,h:fr.height,ratio:fr.width/fr.height,fit:ic.objectFit,pos:ic.objectPosition,src:img.currentSrc||img.src,natural:[img.naturalWidth,img.naturalHeight]},proof:{w:pr.width,h:pr.height}};
            });
            if(state.scrollWidth>state.viewport+2) failures.push(`${mode}: horizontal overflow ${state.scrollWidth}/${state.viewport}`);
            if(state.photo.fit!=='cover') failures.push(`${mode}: photo fit ${state.photo.fit}`);
            if(!state.photo.pos.includes('top') && !state.photo.pos.includes('0%')) failures.push(`${mode}: photo not top safe ${state.photo.pos}`);
            if(state.photo.ratio<0.72 || state.photo.ratio>0.9) failures.push(`${mode}: photo ratio ${state.photo.ratio}`);
            if(!state.photo.natural[0]||!state.photo.natural[1]) failures.push(`${mode}: photo failed decode`);
            fs.writeFileSync(`qa-artifacts/a512/${mode}-state.json`,JSON.stringify(state,null,2));
            await page.locator('#trust').screenshot({path:`qa-artifacts/a512/${mode}-between-cues.png`});
            await ctx.close();
          }
          await browser.close();
          fs.writeFileSync('qa-artifacts/a512/failures.json',JSON.stringify(failures,null,2));
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          JS
          node a512.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a512-between-cues
          path: qa-artifacts/a512
          if-no-files-found: error
