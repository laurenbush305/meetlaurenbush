name: A5.11 Full Live Site QA
# Post-deploy verification for A5.11.3 casting render correction and current live-media repairs.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Wait for A5.11.3 on public domain
        run: |
          for i in $(seq 1 30); do
            if curl -fsSL --max-time 15 "https://meetlaurenbush.com/assets/css/a58-art-pass.css?qa=a5113-$i" | grep -q 'a5113-casting-render-fix'; then
              echo 'A5.11.3 is live.'
              exit 0
            fi
            echo "Waiting for GitHub Pages deployment ($i/30)..."
            sleep 10
          done
          echo 'Timed out waiting for A5.11.3 public CSS.' >&2
          exit 1
      - name: Render every public page from the live domain
        run: |
          cat > live-site.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('qa-artifacts/live-site',{recursive:true});
          const failures=[];
          const browser=await chromium.launch({headless:true});
          const pages=[
            ['home','/'],
            ['casting','/casting-sheet.html'],
            ['scrambled','/project-scrambled-up.html'],
            ['pickleball-bag','/project-pickleball-bag.html'],
            ['montis','/project-dear-diary-montis.html'],
            ['centerline','/project-honcho-centerline.html']
          ];
          for(const [label,path] of pages){
            for(const [mode,width,height] of [['desktop',1440,1000],['mobile',390,844]]){
              const ctx=await browser.newContext({viewport:{width,height},deviceScaleFactor:1,colorScheme:'light'});
              const page=await ctx.newPage();
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
              const res=await page.goto(`https://meetlaurenbush.com${path}?qa=post-a5113-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              if(!res?.ok()) failures.push(`${label}-${mode}: HTTP ${res?.status()}`);
              await page.waitForTimeout(900);
              await page.evaluate(async()=>{
                const step=Math.max(500,Math.floor(innerHeight*.7));
                for(let y=0;y<document.documentElement.scrollHeight;y+=step){
                  scrollTo(0,y); await new Promise(r=>setTimeout(r,80));
                }
                scrollTo(0,document.documentElement.scrollHeight);
              });
              await page.waitForTimeout(900);
              const imageAudit=await page.evaluate(()=>[...document.images].map((img,i)=>({i,alt:img.alt,src:img.currentSrc||img.src,complete:img.complete,w:img.naturalWidth,h:img.naturalHeight,display:getComputedStyle(img).display,visibility:getComputedStyle(img).visibility,opacity:getComputedStyle(img).opacity})).filter(x=>x.display!=='none'));
              for(const x of imageAudit){
                if(!x.complete||x.w===0||x.h===0) failures.push(`${label}-${mode}: undecoded image ${x.i} ${x.src}`);
              }

              let repairState=null;
              if(label==='home'){
                repairState=await page.evaluate(()=>{
                  const bg=s=>getComputedStyle(document.querySelector(s)).backgroundImage;
                  const child=s=>getComputedStyle(document.querySelector(s)).display;
                  return {
                    explain:{bg:bg('.explain-detail-bag'),oldChild:child('.explain-detail-bag>img')},
                    television:{bg:bg('.tv-set-detail'),oldChild:child('.tv-set-detail>img')},
                    activate:{bg:bg('.activate-material'),oldChild:child('.activate-material>img')}
                  };
                });
                if(!repairState.explain.bg.includes('wimpb-campaign-main.jpg')) failures.push(`${label}-${mode}: WIMPB repair missing ${repairState.explain.bg}`);
                if(!repairState.television.bg.includes('scrambled-podium-smile.webp')) failures.push(`${label}-${mode}: Scrambled repair missing ${repairState.television.bg}`);
                if(!repairState.activate.bg.includes('activate-centerline-wide.jpg')) failures.push(`${label}-${mode}: Centerline repair missing ${repairState.activate.bg}`);
                for(const [k,v] of Object.entries(repairState)) if(v.oldChild!=='none') failures.push(`${label}-${mode}: old ${k} JPEG still rendered`);
              }

              let castingLayout=null;
              if(label==='casting'){
                castingLayout=await page.evaluate(()=>{
                  const h=document.querySelector('#operator-title');
                  const c=document.querySelector('.operator-copy');
                  const hr=h.getBoundingClientRect();
                  const cr=c.getBoundingClientRect();
                  return {
                    viewport:innerWidth,
                    headline:{left:hr.left,right:hr.right,width:hr.width,fontSize:getComputedStyle(h).fontSize,text:h.innerText},
                    copy:{left:cr.left,right:cr.right,width:cr.width},
                    scrollWidth:document.documentElement.scrollWidth
                  };
                });
                if(castingLayout.headline.right > castingLayout.viewport + 1) failures.push(`${label}-${mode}: operator headline escapes viewport right=${castingLayout.headline.right} viewport=${castingLayout.viewport}`);
                if(castingLayout.headline.right > castingLayout.copy.right + 1) failures.push(`${label}-${mode}: operator headline escapes its column right=${castingLayout.headline.right} copy=${castingLayout.copy.right}`);
                if(castingLayout.scrollWidth > castingLayout.viewport + 2) failures.push(`${label}-${mode}: horizontal overflow scrollWidth=${castingLayout.scrollWidth} viewport=${castingLayout.viewport}`);
              }

              if(errors.length) failures.push(...errors.map(x=>`${label}-${mode}: console ${x}`));
              fs.writeFileSync(`qa-artifacts/live-site/${label}-${mode}-state.json`,JSON.stringify({url:page.url(),imageAudit,repairState,castingLayout,errors},null,2));
              await page.evaluate(()=>window.scrollTo(0,0));
              await page.waitForTimeout(250);

              // Full-page screenshots and sticky/fixed headers are a bad marriage in Chromium stitching.
              // QA the real header first, then pin it into normal document flow only for the proof image.
              await page.addStyleTag({content:'.topbar{position:absolute!important;top:0!important;left:0!important;right:0!important}'});
              await page.screenshot({path:`qa-artifacts/live-site/${label}-${mode}.png`,fullPage:true});

              if(label==='casting'){
                await page.locator('.operator-section').scrollIntoViewIfNeeded();
                await page.waitForTimeout(250);
                await page.locator('.operator-section').screenshot({path:`qa-artifacts/live-site/${label}-${mode}-operator.png`});
              }
              await ctx.close();
            }
          }
          await browser.close();
          fs.writeFileSync('qa-artifacts/live-site/failures.json',JSON.stringify(failures,null,2));
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          JS
          node live-site.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a511-full-live-site
          path: qa-artifacts/live-site
          if-no-files-found: error
