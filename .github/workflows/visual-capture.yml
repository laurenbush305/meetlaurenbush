name: Visual Capture — Manual Trigger Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.qa-trigger'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser
        continue-on-error: true
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Capture current public site
        continue-on-error: true
        run: |
          cat > capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('qa-artifacts',{recursive:true});
          const browser=await chromium.launch({headless:true});
          for (const [name,width,height] of [['desktop',1440,1000],['tablet',768,1024],['mobile',390,844]]) {
            const ctx=await browser.newContext({viewport:{width,height},colorScheme:'light'});
            const page=await ctx.newPage();
            await page.goto(`https://meetlaurenbush.com/?capture=${Date.now()}-${name}`,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(1500);
            await page.evaluate(async()=>{
              const max=document.documentElement.scrollHeight;
              for(let y=0;y<max;y+=Math.max(500,innerHeight*.75)){
                scrollTo(0,y);
                await new Promise(r=>setTimeout(r,120));
              }
              scrollTo(0,0);
            });
            await page.waitForTimeout(500);
            await page.screenshot({path:`qa-artifacts/${name}-full.png`,fullPage:true});
            for(const [key,selector] of [['hero','main > section:first-of-type'],['person','#person']]){
              const el=page.locator(selector).first();
              if(await el.count()) await el.screenshot({path:`qa-artifacts/${name}-${key}.png`});
            }
            const state=await page.evaluate(()=>({
              release:document.body?.dataset?.releaseStatus||null,
              width:innerWidth,
              scrollWidth:document.documentElement.scrollWidth,
              height:document.documentElement.scrollHeight
            }));
            fs.writeFileSync(`qa-artifacts/${name}-state.json`,JSON.stringify(state,null,2));
            await ctx.close();
          }
          await browser.close();
          JS
          node capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-capture
          path: qa-artifacts
          if-no-files-found: warn
