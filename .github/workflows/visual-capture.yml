name: Season Zero Visual QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'assets/img/**'
      - 'scripts/visual-qa.mjs'
      - '.qa-trigger'
      - '.github/workflows/visual-capture.yml'

permissions:
  contents: read

concurrency:
  group: season-zero-visual-qa-main
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for current public files to reach GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          FILES=()

          if [[ -n "${BEFORE}" && ! "${BEFORE}" =~ ^0+$ ]]; then
            mapfile -t FILES < <(
              git diff --name-only "$BEFORE" "$GITHUB_SHA" -- '*.html' 'assets/css/**' 'assets/js/**' 'assets/img/**' \
                | while read -r f; do [[ -f "$f" ]] && printf '%s\n' "$f"; done \
                | head -n 5
            )
          fi

          # QA-only and manual-trigger commits still need to prove they are photographing
          # the current public site, not the previous Pages deployment.
          if [[ ${#FILES[@]} -eq 0 ]]; then
            FILES=(index.html casting-sheet.html)
          fi

          echo "Polling public files against this checkout: ${FILES[*]}"
          for attempt in {1..60}; do
            all_match=1
            for f in "${FILES[@]}"; do
              local_hash=$(sha256sum "$f" | awk '{print $1}')
              remote="https://meetlaurenbush.com/${f}?qa=${GITHUB_SHA}-${attempt}"
              if ! curl -fsSL "$remote" -o /tmp/season-zero-remote; then
                all_match=0
                break
              fi
              remote_hash=$(sha256sum /tmp/season-zero-remote | awk '{print $1}')
              if [[ "$local_hash" != "$remote_hash" ]]; then
                all_match=0
                break
              fi
            done
            if [[ "$all_match" -eq 1 ]]; then
              echo "Current public files match this checkout."
              exit 0
            fi
            sleep 10
          done

          echo "Timed out waiting for GitHub Pages to match the current checkout." >&2
          exit 1

      - name: Prepare browser automation
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$CHROME_PATH" ]]; then
            echo "Runner Chrome not found." >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-save --ignore-scripts playwright-core@1.55.0 >/dev/null
          echo "Using runner browser: $CHROME_PATH"

      - name: Capture homepage and casting-sheet scenes, interactions, and QA state
        env:
          QA_SHA: ${{ github.sha }}
        run: |
          mkdir -p qa-artifacts
          node scripts/visual-qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: season-zero-visual-qa-${{ github.sha }}
          path: qa-artifacts
          if-no-files-found: error
          retention-days: 30
