name: Quiet Visual Capture

on:
  push:
    branches: [main]
    paths:
      - '.qa-trigger'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for current design CSS to be public
        continue-on-error: true
        shell: bash
        run: |
          EXPECTED="a5194-explain-create-room-light.css"
          for i in {1..36}; do
            WRAP=$(curl -fsSL "https://meetlaurenbush.com/assets/css/a58-art-pass.css?wait=${RANDOM}${RANDOM}" || true)
            FILE=$(curl -fsSL "https://meetlaurenbush.com/assets/css/${EXPECTED}?wait=${RANDOM}${RANDOM}" || true)
            if printf '%s' "$WRAP" | grep -Fq "$EXPECTED" && printf '%s' "$FILE" | grep -Fq 'A5.19.4'; then
              echo "Current design CSS is public."
              exit 0
            fi
            sleep 10
          done
          echo "Public CSS wait timed out; capture will still run for inspection."
          exit 0
      - name: Install Chromium
        continue-on-error: true
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1 || true
          npx playwright install --with-deps chromium >/dev/null 2>&1 || true
      - name: Capture all homepage scenes
        continue-on-error: true
        run: |
          mkdir -p qa-artifacts
          cat > capture.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const scenes=[
            ['hero','main > section:first-of-type'],
            ['person','#person'],
            ['explain','#explain'],
            ['create','#create'],
            ['television','#television'],
            ['host','#host'],
            ['activate','#activate'],
            ['watch','#watch'],
            ['between-cues','#trust'],
            ['imagination','#imagination'],
            ['book','#book']
          ];
          const browser=await chromium.launch({headless:true});
          for(const [name,width,height] of [['desktop',1440,1000],['tablet',768,1024],['mobile',390,844]]){
            const ctx=await browser.newContext({viewport:{width,height},colorScheme:'light'});
            const page=await ctx.newPage();
            await page.goto(`https://meetlaurenbush.com/?quietcapture=${Date.now()}-${name}`,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(1200);
            const max=await page.evaluate(()=>document.documentElement.scrollHeight);
            for(let y=0;y<max;y+=Math.max(520,Math.floor(height*.72))){
              await page.evaluate(y=>scrollTo(0,y),y);
              await page.waitForTimeout(110);
            }
            await page.evaluate(()=>scrollTo(0,0));
            await page.waitForTimeout(500);
            await page.screenshot({path:`qa-artifacts/${name}-full.png`,fullPage:true});
            for(const [key,sel] of scenes){
              const loc=page.locator(sel).first();
              if(await loc.count()){
                await loc.scrollIntoViewIfNeeded();
                await page.waitForTimeout(180);
                try{ await loc.screenshot({path:`qa-artifacts/${name}-${key}.png`}); }catch(e){}
              }
            }
            const state=await page.evaluate(()=>({release:document.body?.dataset?.releaseStatus||null,width:innerWidth,scrollWidth:document.documentElement.scrollWidth,height:document.documentElement.scrollHeight}));
            fs.writeFileSync(`qa-artifacts/${name}-state.json`,JSON.stringify(state,null,2));
            await ctx.close();
          }
          await browser.close();
          JS
          node capture.mjs || true
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: quiet-visual-capture
          path: qa-artifacts
          if-no-files-found: warn
