name: A5.10.8 One-Time Stardust Background Fallback Patcher

on:
  push:
    branches:
      - 'fix/a5108-force-light-rendering'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add explicit authored background-color fallbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/css/a5108-stardust-restoration.css')
          text=p.read_text()
          marker='/* ---------- EXPLICIT AUTHORED SURFACE FALLBACKS ---------- */'
          if marker not in text:
              block='''\n\n/* ---------- EXPLICIT AUTHORED SURFACE FALLBACKS ---------- */\n/* Keep real base colors present underneath optical gradients. This gives auto-dark-resistant browsers and QA a deterministic authored surface without flattening the material layers above. */\n.hero,.person,.explain,.create,.activate,.trust,.imagination{background-color:var(--sd-pearl)!important}\n.television,.host,.watch,.book{background-color:var(--sd-night)!important}\nbody.cast58,.cast58 .casting-hero,.cast58 .proof-section,.a510-cast .proof-section,.cast58 .operator-section,.project-file,.project-file .project-hero,.project-file .project-evidence,.project-file .project-notes{background-color:var(--sd-pearl)!important}\n.cast58 .door-section,.cast58 .booking-section,.project-file .project-close,.project-file .project-foot{background-color:var(--sd-night)!important}\n'''
              insert='\n@media(prefers-reduced-motion:reduce)'
              assert insert in text
              text=text.replace(insert,block+insert,1)
              p.write_text(text)
              print('Added explicit Stardust surface fallbacks.')
          else:
              print('Surface fallbacks already present.')
          PY
      - name: Commit background fallbacks
        run: |
          if git diff --quiet -- assets/css/a5108-stardust-restoration.css; then
            echo 'No fallback changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/a5108-stardust-restoration.css
          git commit -m 'Add explicit Stardust surface fallbacks'
          git push
