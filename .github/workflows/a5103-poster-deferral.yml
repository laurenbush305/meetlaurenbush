name: A5.10.3 Poster Deferral Patcher

on:
  push:
    branches: [build/a5103-mobile-network]
    paths:
      - .github/workflows/a5103-poster-deferral.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-posters:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/a5103-mobile-network
          fetch-depth: 0

      - name: Convert video poster URLs to deferred data attributes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text()
          count = html.count(' poster="')
          if count < 4:
              raise SystemExit(f'Expected at least 4 video poster attributes, found {count}; refusing ambiguous patch.')
          html = html.replace(' poster="', ' data-poster="')
          if ' poster="' in html:
              raise SystemExit('Poster attribute replacement incomplete.')
          path.write_text(html)
          print(f'Deferred {count} poster attributes.')
          PY

      - name: Commit poster deferral markup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No markup changes."
            exit 0
          fi
          git commit -m "Defer A5.10.3 below-fold video posters"
          git push origin HEAD:build/a5103-mobile-network
