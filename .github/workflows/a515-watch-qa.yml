name: A5.15 Watch Visual QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Wait for A5.15 on public domain
        run: |
          for i in $(seq 1 36); do
            if curl -fsSL --max-time 15 "https://meetlaurenbush.com/?release=a515-watch-$i" | grep -q 'data-release-status="a515-watch-design"'; then
              echo 'A5.15 Watch is live.'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for A5.15 Watch.' >&2
          exit 1
      - name: Render Watch
        run: |
          cat > a515.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('qa-artifacts/a515',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const failures=[];
          const programs=['scrambled','wimpb','montis','apq','archive'];
          for(const [mode,width,height] of [['desktop',1440,1000],['mobile',390,844]]){
            const ctx=await browser.newContext({viewport:{width,height},colorScheme:'light'});
            const page=await ctx.newPage();
            const res=await page.goto(`https://meetlaurenbush.com/?qa=a515-watch-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            if(!res?.ok()) failures.push(`${mode}: HTTP ${res?.status()}`);
            await page.waitForTimeout(700);
            await page.evaluate(()=>{
              const section=document.querySelector('#watch');
              const header=document.querySelector('.topbar');
              window.scrollTo({top:section.offsetTop-header.getBoundingClientRect().height-24,behavior:'instant'});
            });
            await page.waitForTimeout(900);
            const base=await page.evaluate(()=>{
              const s=document.querySelector('#watch').getBoundingClientRect();
              const h=document.querySelector('#watch h2').getBoundingClientRect();
              const n=document.querySelector('.topbar').getBoundingClientRect();
              const st=document.querySelector('.watch-stage').getBoundingClientRect();
              const t=document.querySelector('.watch-tuner').getBoundingClientRect();
              return {release:document.body.dataset.releaseStatus,viewport:innerWidth,scrollWidth:document.documentElement.scrollWidth,section:{top:s.top,bottom:s.bottom},heading:{top:h.top,bottom:h.bottom},nav:{top:n.top,bottom:n.bottom},stage:{x:st.x,y:st.y,w:st.width,h:st.height},tuner:{x:t.x,y:t.y,w:t.width,h:t.height},headingNavOverlap:h.top<n.bottom+12&&h.bottom>n.top-8};
            });
            if(base.release!=='a515-watch-design') failures.push(`${mode}: stale release ${base.release}`);
            if(base.scrollWidth>base.viewport+2) failures.push(`${mode}: horizontal overflow ${base.scrollWidth}/${base.viewport}`);
            if(base.headingNavOverlap) failures.push(`${mode}: nav overlaps Watch heading`);
            if(mode==='desktop' && base.stage.w < 950) failures.push(`desktop: Watch stage did not widen ${base.stage.w}`);
            if(mode==='desktop' && base.tuner.w > 300) failures.push(`desktop: tuner did not tighten ${base.tuner.w}`);
            fs.writeFileSync(`qa-artifacts/a515/${mode}-base.json`,JSON.stringify(base,null,2));
            await page.screenshot({path:`qa-artifacts/a515/${mode}-watch.png`,fullPage:false});
            await page.evaluate(()=>document.querySelector('.topbar').style.visibility='hidden');
            await page.locator('#watch').screenshot({path:`qa-artifacts/a515/${mode}-watch-full.png`});
            await page.evaluate(()=>document.querySelector('.topbar').style.visibility='visible');
            for(const program of programs){
              const button=page.locator(`[data-watch="${program}"]`);
              await button.click();
              await page.waitForTimeout(500);
              const panel=page.locator(`[data-watch-panel="${program}"]`);
              const state=await panel.evaluate(el=>{
                const media=el.querySelector('.watch-foreground');
                const meta=el.querySelector('.watch-meta');
                const stage=el.parentElement;
                const r=media.getBoundingClientRect();
                const mr=meta.getBoundingClientRect();
                const sr=stage.getBoundingClientRect();
                const img=media.tagName==='IMG'?media:null;
                const rail=getComputedStyle(el,'::after');
                return {hidden:el.hidden,tag:media.tagName,media:{x:r.x,y:r.y,w:r.width,h:r.height,right:r.right},meta:{x:mr.x,y:mr.y,w:mr.width,h:mr.height,right:mr.right},stage:{x:sr.x,w:sr.width,right:sr.right},rail:{content:rail.content,width:rail.width},natural:img?[img.naturalWidth,img.naturalHeight]:null,src:img?(img.currentSrc||img.src):null};
              });
              if(state.hidden) failures.push(`${mode}/${program}: active panel remained hidden`);
              if(state.tag==='IMG' && (!state.natural?.[0]||!state.natural?.[1])) failures.push(`${mode}/${program}: image failed decode ${state.src}`);
              if(mode==='desktop'){
                if(state.meta.x < state.stage.x + state.stage.w*.66) failures.push(`desktop/${program}: metadata did not enter right rail`);
                if(state.media.right > state.stage.x + state.stage.w*.66) failures.push(`desktop/${program}: media crossed editorial rail`);
                if(state.meta.right > state.stage.right-12) failures.push(`desktop/${program}: metadata clips stage edge`);
                if(state.rail.content==='none') failures.push(`desktop/${program}: editorial rail pseudo-layer missing`);
              }
              if(mode==='mobile' && state.rail.content!=='none') failures.push(`mobile/${program}: desktop editorial rail leaked into mobile`);
              fs.writeFileSync(`qa-artifacts/a515/${mode}-${program}.json`,JSON.stringify(state,null,2));
              await page.locator('#watch').screenshot({path:`qa-artifacts/a515/${mode}-${program}.png`});
            }
            await ctx.close();
          }
          await browser.close();
          fs.writeFileSync('qa-artifacts/a515/failures.json',JSON.stringify(failures,null,2));
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          JS
          node a515.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a515-watch
          path: qa-artifacts/a515
          if-no-files-found: error
