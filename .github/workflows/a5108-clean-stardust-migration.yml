name: A5.10.8 Clean Stardust Migration

on:
  push:
    branches:
      - 'build/a5108-stardust-rebuild'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bring only approved Stardust visual authority onto rollback base
        run: |
          git fetch origin fix/a5108-force-light-rendering
          git show origin/fix/a5108-force-light-rendering:assets/css/a5108-stardust-restoration.css > assets/css/a5108-stardust-restoration.css
          git show origin/fix/a5108-force-light-rendering:assets/css/a5108-stardust-optics.css > assets/css/a5108-stardust-optics.css
          git show origin/fix/a5108-force-light-rendering:assets/css/a5108-stardust-surface-lock.css > assets/css/a5108-stardust-surface-lock.css
          mkdir -p docs
          git show origin/fix/a5108-force-light-rendering:docs/SEASON-ZERO-VISUAL-CANON.md > docs/SEASON-ZERO-VISUAL-CANON.md

      - name: Make Stardust the final visual layer without A5.10.6 or A5.10.7 palette CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/css/a58-art-pass.css')
          text=p.read_text()
          marker="@import url('a5101-360-polish.css');"
          assert marker in text
          additions="\n@import url('a5108-stardust-restoration.css');\n@import url('a5108-stardust-optics.css');\n@import url('a5108-stardust-surface-lock.css');"
          if 'a5108-stardust-restoration.css' not in text:
              text=text.replace(marker,marker+additions)
          text=text.replace('/* A5.10.1 FIRST-PAINT WRAPPER\n   Preserve the A5.8 authored base, then apply A5.9 elevation, QA polish and the 360px mobile audit corrections synchronously. */',
          '/* A5.10.8 STARDUST REBUILD WRAPPER\n   A5.10.5 is the rollback foundation. Stardust restoration + optics define art direction; surface-lock only protects authored material bodies. */')
          p.write_text(text)
          PY

      - name: Lock authored light materials against browser auto-darkening
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          required='<meta name="color-scheme" content="only light">\n<meta name="supported-color-schemes" content="light">\n<meta name="darkreader-lock">'
          pages=sorted(Path('.').glob('*.html'))
          assert pages
          viewport_re=re.compile(r'(<meta\s+name="viewport"\s+content="[^"]+"\s*/?>)',re.I)
          charset_re=re.compile(r'(<meta\s+charset="utf-8"\s*/?>)',re.I)
          for p in pages:
              text=p.read_text()
              if '<meta name="darkreader-lock">' not in text:
                  if viewport_re.search(text):
                      text=viewport_re.sub(lambda m:m.group(1)+'\n'+required,text,count=1)
                  elif charset_re.search(text):
                      text=charset_re.sub(lambda m:m.group(1)+'\n'+required,text,count=1)
                  else:
                      raise AssertionError(f'No insertion point in {p}')
              text=re.sub(r'<meta\s+name="theme-color"\s+content="#[0-9a-fA-F]{6}"\s*/?>','<meta name="theme-color" content="#fbfcfd">',text)
              p.write_text(text)
          print('Browser color lock applied to',len(pages),'HTML pages')
          PY

      - name: Validate clean migration scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wrapper=Path('assets/css/a58-art-pass.css').read_text()
          assert 'a5106-bright-palette.css' not in wrapper
          assert 'a5107-accessible-signal-palette.css' not in wrapper
          assert wrapper.index('a5108-stardust-restoration.css') < wrapper.index('a5108-stardust-optics.css') < wrapper.index('a5108-stardust-surface-lock.css')
          for f in ['assets/css/a5108-stardust-restoration.css','assets/css/a5108-stardust-optics.css','assets/css/a5108-stardust-surface-lock.css','docs/SEASON-ZERO-VISUAL-CANON.md']:
              assert Path(f).exists(), f
          for p in Path('.').glob('*.html'):
              t=p.read_text().lower()
              assert '<meta name="color-scheme" content="only light">' in t
              assert '<meta name="supported-color-schemes" content="light">' in t
              assert '<meta name="darkreader-lock">' in t
          print('Clean Stardust migration validated')
          PY

      - name: Commit migrated rebuild files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/a58-art-pass.css assets/css/a5108-stardust-restoration.css assets/css/a5108-stardust-optics.css assets/css/a5108-stardust-surface-lock.css docs/SEASON-ZERO-VISUAL-CANON.md *.html
          if git diff --cached --quiet; then
            echo 'No migration changes needed.'
            exit 0
          fi
          git commit -m 'Rebuild Stardust from A5.10.5 rollback base'
          git push
