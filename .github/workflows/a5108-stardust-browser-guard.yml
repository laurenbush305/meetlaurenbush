name: A5.10.8 Stardust Browser Guard

on:
  push:
    branches:
      - 'build/a5108-stardust-rebuild'
  pull_request:
    branches:
      - main

jobs:
  stardust-browser-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate visual authority and clean layer order
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          wrapper=Path('assets/css/a58-art-pass.css').read_text()
          canon=Path('docs/SEASON-ZERO-VISUAL-CANON.md').read_text().lower()
          accessibility=Path('assets/css/a5108-stardust-accessibility.css').read_text().lower()
          imports=re.findall(r"@import url\('([^']+)'\);",wrapper)
          expected=['a5108-stardust-restoration.css','a5108-stardust-optics.css','a5108-stardust-surface-lock.css','a5108-stardust-accessibility.css']
          assert imports[-4:]==expected, imports[-4:]
          assert 'a5106-bright-palette.css' not in wrapper
          assert 'a5107-accessible-signal-palette.css' not in wrapper
          assert 'implementation-only layer' in accessibility
          assert 'does not define art direction' in accessibility
          assert 'scroll-margin-top:94px' in accessibility
          for phrase in ['locked visual authority','do not translate this brief into a flat palette system','pearl','refraction','css and real media are the default foundation']:
              assert phrase in canon, phrase
          for page in Path('.').glob('*.html'):
              text=page.read_text().lower()
              for required in ['<meta name="color-scheme" content="only light">','<meta name="supported-color-schemes" content="light">','<meta name="darkreader-lock">']:
                  assert required in text, f'{page}: {required}'
          print('Stardust authority + browser locks + accessibility/usability boundary: PASS')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser tooling
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 @axe-core/playwright@4.10.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/a5108-server.log 2>&1 &
          sleep 2

      - name: Render authored Stardust in normal and hostile dark contexts
        run: |
          cat > a5108-browser.mjs <<'JS'
          import { chromium } from 'playwright';
          import AxeBuilder from '@axe-core/playwright';
          import fs from 'node:fs';
          fs.mkdirSync('qa-artifacts/a5108', {recursive:true});

          const chapters={
            hero:'.hero',person:'.person',explain:'.explain',create:'.create',television:'.television',
            host:'.host',activate:'.activate',watch:'.watch',trust:'.trust',imagination:'.imagination',book:'.book'
          };
          const failures=[];

          function rgb(s){const m=s.match(/rgba?\(([^)]+)\)/); return m?m[1].split(',').slice(0,3).map(Number):null;}
          function lum(v){if(!v)return null; const x=v.map(n=>{const c=n/255;return c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4)});return .2126*x[0]+.7152*x[1]+.0722*x[2];}

          async function auditPage(page,label){
            const axe=await new AxeBuilder({page}).withRules(['color-contrast']).analyze();
            if(axe.violations.length){
              failures.push(`${label}: ${axe.violations.length} color-contrast violation group(s)`);
              for(const v of axe.violations){console.error(label,v.id,v.nodes.map(n=>n.target.join(' ')).join(' | '));}
            }
          }

          async function hydrateDeferredImages(page){
            const deferred=page.locator('img[data-src], img[data-srcset], video[data-poster]');
            const count=await deferred.count();
            for(let i=0;i<count;i++){
              const loc=deferred.nth(i);
              if(await loc.isVisible().catch(()=>false)){
                await loc.scrollIntoViewIfNeeded().catch(()=>{});
                await page.waitForTimeout(90);
              }
            }
            await page.evaluate(()=>window.scrollTo(0,0));
            await page.waitForTimeout(180);
          }

          async function inspectHomepage(browser,label,width,height){
            const context=await browser.newContext({viewport:{width,height},colorScheme:'dark'});
            const page=await context.newPage();
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
            const state=await page.evaluate(()=>{
              const data={scheme:getComputedStyle(document.documentElement).colorScheme};
              const sels={hero:'.hero',person:'.person',explain:'.explain',activate:'.activate',trust:'.trust',imagination:'.imagination',television:'.television',host:'.host',watch:'.watch',book:'.book'};
              for(const [k,s] of Object.entries(sels)){
                const cs=getComputedStyle(document.querySelector(s)); data[k]={bg:cs.backgroundColor,color:cs.color,image:cs.backgroundImage};
              }
              return data;
            });
            console.log(label,state);
            const words=state.scheme.toLowerCase().split(/\s+/);
            if(!words.includes('light')||words.includes('dark')) failures.push(`${label}: color-scheme=${state.scheme}`);
            for(const k of ['hero','person','explain','activate','trust','imagination']){
              const L=lum(rgb(state[k].bg)); if(L===null||L<.88) failures.push(`${label}: ${k} base became dark ${state[k].bg}`);
              if(!state[k].image || state[k].image==='none') failures.push(`${label}: ${k} lost optical background image`);
            }
            for(const k of ['television','host','watch','book']){
              const L=lum(rgb(state[k].bg)); if(L===null||L>.08) failures.push(`${label}: ${k} lost On Air depth ${state[k].bg}`);
            }

            const topbar=page.locator('.topbar');
            const topbarBox=await topbar.boundingBox();
            for(const [name,selector] of Object.entries(chapters)){
              const loc=page.locator(selector);
              await page.evaluate((sel)=>document.querySelector(sel)?.scrollIntoView({block:'start',inline:'nearest'}),selector);
              await page.waitForTimeout(300);
              if(name!=='hero' && topbarBox){
                const sectionBox=await loc.boundingBox();
                if(sectionBox && sectionBox.y < topbarBox.height + 8){
                  failures.push(`${label}-${width}: ${name} chapter starts under sticky nav (section y=${sectionBox.y.toFixed(1)}, nav h=${topbarBox.height.toFixed(1)})`);
                }
              }
              await loc.screenshot({path:`qa-artifacts/a5108/${name}-${label}-${width}.png`});
            }
            await auditPage(page,`${label}-${width}-homepage`);
            await page.screenshot({path:`qa-artifacts/a5108/home-${label}-${width}-hydrated.png`,fullPage:true});
            await context.close();
          }

          const normal=await chromium.launch({headless:true});
          await inspectHomepage(normal,'dark-preference',390,844);
          await inspectHomepage(normal,'desktop',1440,1000);

          const publicPages=['casting-sheet.html','project-scrambled-up.html','project-pickleball-bag.html','project-dear-diary-montis.html','project-honcho-centerline.html','404.html'];
          for(const path of publicPages){
            const context=await normal.newContext({viewport:{width:390,height:844},colorScheme:'dark'});
            const page=await context.newPage();
            await page.goto(`http://127.0.0.1:4173/${path}`,{waitUntil:'networkidle'});
            await hydrateDeferredImages(page);
            await auditPage(page,`dark-preference-390-${path}`);
            await page.screenshot({path:`qa-artifacts/a5108/${path.replace('.html','')}-390-hydrated.png`,fullPage:true});
            await context.close();
          }
          await normal.close();

          const forced=await chromium.launch({headless:true,args:['--force-dark-mode','--enable-features=WebContentsForceDark']});
          await inspectHomepage(forced,'forced-dark',390,844);
          await forced.close();

          fs.writeFileSync('qa-artifacts/a5108/failures.json',JSON.stringify(failures,null,2));
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          JS
          node a5108-browser.mjs
          rm a5108-browser.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a5108-stardust-browser-qa
          path: qa-artifacts/a5108
          if-no-files-found: error
