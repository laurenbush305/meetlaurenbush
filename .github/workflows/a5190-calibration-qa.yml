name: A5.19 Warm Prismatic Calibration QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Wait for A5.19 calibration on public domain
        run: |
          for i in $(seq 1 48); do
            if curl -fsSL --max-time 15 "https://meetlaurenbush.com/?release=a5190-$i" | grep -q 'data-release-status="a5190-warm-prismatic-calibration"'; then
              echo 'A5.19 Warm Prismatic calibration is live.'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for A5.19 calibration.' >&2
          exit 1
      - name: Render Hero and Person calibration
        run: |
          cat > a5190.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('qa-artifacts/a5190',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const failures=[];
          for(const [mode,width,height] of [['desktop',1440,1000],['tablet',768,1024],['mobile',390,844]]){
            const ctx=await browser.newContext({viewport:{width,height},colorScheme:'light',reducedMotion:'reduce'});
            const page=await ctx.newPage();
            const pageErrors=[]; const consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            const res=await page.goto(`https://meetlaurenbush.com/?qa=a5190-${mode}-${Date.now()}`,{waitUntil:'networkidle',timeout:45000});
            if(!res?.ok()) failures.push(`${mode}: HTTP ${res?.status()}`);
            await page.waitForTimeout(700);
            const state=await page.evaluate(()=>{
              const rect=sel=>{const r=document.querySelector(sel).getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height,top:r.top,bottom:r.bottom,right:r.right}};
              const heroImg=document.querySelector('.hero-photo img');
              const transmission=document.querySelector('.hero-transmission img');
              const personImgs=[...document.querySelectorAll('#person img')];
              const root=getComputedStyle(document.documentElement);
              const hero=getComputedStyle(document.querySelector('.hero'));
              const person=getComputedStyle(document.querySelector('#person'));
              const nav=rect('.topbar');
              const heroTitle=rect('#hero-title');
              return {
                release:document.body.dataset.releaseStatus,
                viewport:innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                cssToken:root.getPropertyValue('--wps-ivory').trim(),
                heroBackground:hero.backgroundImage,
                personBackground:person.backgroundImage,
                nav,
                heroTitle,
                hero:rect('.hero'),
                person:rect('#person'),
                heroImg:{src:heroImg.currentSrc||heroImg.src,natural:[heroImg.naturalWidth,heroImg.naturalHeight],fit:getComputedStyle(heroImg).objectFit,pos:getComputedStyle(heroImg).objectPosition},
                transmission:{natural:[transmission.naturalWidth,transmission.naturalHeight]},
                personImgs:personImgs.map(i=>({src:i.currentSrc||i.src,natural:[i.naturalWidth,i.naturalHeight],fit:getComputedStyle(i).objectFit,pos:getComputedStyle(i).objectPosition})),
                pageErrors:[],
              };
            });
            state.pageErrors=pageErrors; state.consoleErrors=consoleErrors;
            if(state.release!=='a5190-warm-prismatic-calibration') failures.push(`${mode}: stale release ${state.release}`);
            if(!state.cssToken) failures.push(`${mode}: A5.19 token layer missing`);
            if(state.scrollWidth>state.viewport+2) failures.push(`${mode}: horizontal overflow ${state.scrollWidth}/${state.viewport}`);
            if(!state.heroBackground.includes('radial-gradient')) failures.push(`${mode}: Hero atmosphere not applied`);
            if(!state.personBackground.includes('radial-gradient')) failures.push(`${mode}: Person atmosphere not applied`);
            if(!state.heroImg.natural[0]||!state.heroImg.natural[1]) failures.push(`${mode}: Hero image failed decode`);
            if(!state.transmission.natural[0]||!state.transmission.natural[1]) failures.push(`${mode}: Host receipt failed decode`);
            if(state.personImgs.length<3||state.personImgs.some(i=>!i.natural[0]||!i.natural[1])) failures.push(`${mode}: Person image decode failure`);
            if(state.pageErrors.length) failures.push(`${mode}: page errors ${state.pageErrors.join(' | ')}`);
            if(state.consoleErrors.length) failures.push(`${mode}: console errors ${state.consoleErrors.join(' | ')}`);
            fs.writeFileSync(`qa-artifacts/a5190/${mode}-state.json`,JSON.stringify(state,null,2));
            await page.screenshot({path:`qa-artifacts/a5190/${mode}-first-viewport.png`,fullPage:false});
            await page.locator('.hero').screenshot({path:`qa-artifacts/a5190/${mode}-hero-full.png`});
            await page.evaluate(()=>{
              const section=document.querySelector('#person');
              const header=document.querySelector('.topbar');
              window.scrollTo({top:section.offsetTop-header.getBoundingClientRect().height-24,behavior:'instant'});
            });
            await page.waitForTimeout(500);
            const personHeading=await page.locator('#person-title').boundingBox();
            const navBox=await page.locator('.topbar').boundingBox();
            if(personHeading&&navBox&&personHeading.y<navBox.y+navBox.height+10) failures.push(`${mode}: nav crowds Person heading`);
            await page.screenshot({path:`qa-artifacts/a5190/${mode}-person-entry.png`,fullPage:false});
            await page.evaluate(()=>document.querySelector('.topbar').style.visibility='hidden');
            await page.locator('#person').screenshot({path:`qa-artifacts/a5190/${mode}-person-full.png`});
            await ctx.close();
          }
          await browser.close();
          fs.writeFileSync('qa-artifacts/a5190/failures.json',JSON.stringify(failures,null,2));
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          JS
          node a5190.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a5190-warm-prismatic-calibration
          path: qa-artifacts/a5190
          if-no-files-found: error
