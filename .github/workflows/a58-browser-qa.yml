name: A5.8 Browser QA

on:
  push:
    branches: [build/a58-flagship-candidate]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser tooling
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/seasonzero-server.log 2>&1 &
          sleep 2
      - name: Run responsive QA
        run: |
          mkdir -p qa-artifacts
          cat > /tmp/a58-qa.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const widths = [1440, 1024, 768, 430, 390, 360];
          const heights = {1440:900,1024:900,768:900,430:932,390:844,360:800};
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          async function hydratePage(page) {
            await page.evaluate(async () => {
              const wait = ms => new Promise(r => setTimeout(r, ms));
              [...document.images].forEach(img => img.loading = 'eager');
              const step = Math.max(500, Math.floor(innerHeight * .8));
              const max = document.documentElement.scrollHeight;
              for (let y = 0; y < max; y += step) {
                scrollTo(0, y);
                await wait(70);
              }
              scrollTo(0, max);
              await wait(180);
              await Promise.all([...document.images].map(img => {
                if (img.complete) return Promise.resolve();
                return new Promise(resolve => {
                  img.addEventListener('load', resolve, {once:true});
                  img.addEventListener('error', resolve, {once:true});
                  setTimeout(resolve, 3000);
                });
              }));
              scrollTo(0, 0);
              await wait(120);
            });
          }

          async function inspect(page) {
            return page.evaluate(() => {
              const de = document.documentElement;
              const ids = [...document.querySelectorAll('[id]')].map(e=>e.id);
              const wimpb = [...document.images]
                .filter(i => (i.getAttribute('src') || '').includes('wimpb-campaign-main.jpg'))
                .map(i => ({src:i.getAttribute('src'), complete:i.complete, naturalWidth:i.naturalWidth, naturalHeight:i.naturalHeight}));
              return {
                sw: de.scrollWidth,
                cw: de.clientWidth,
                broken: [...document.images].filter(i=>!i.complete || i.naturalWidth===0).map(i=>i.getAttribute('src')),
                missingAlt: [...document.images].filter(i=>!i.hasAttribute('alt')).map(i=>i.getAttribute('src')),
                duplicateIds: [...new Set(ids.filter((x,i)=>ids.indexOf(x)!==i))],
                h1: document.querySelectorAll('h1').length,
                unnamedButtons: [...document.querySelectorAll('button')].filter(b=>!(b.innerText.trim()||b.getAttribute('aria-label'))).length,
                emptyLinks: [...document.querySelectorAll('a')].filter(a=>!(a.innerText.trim()||a.getAttribute('aria-label'))).length,
                wimpb
              };
            });
          }

          (async()=>{
            const browser = await chromium.launch({headless:true});
            const results = {home:{}, casting:{}};
            let failed = false;
            for (const width of widths) {
              const page = await browser.newPage({viewport:{width,height:heights[width]}});
              const pageErrors = [];
              const consoleErrors = [];
              page.on('pageerror', e => pageErrors.push(String(e)));
              page.on('console', m => { if (m.type()==='error') consoleErrors.push(m.text()); });
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
              await hydratePage(page);
              const data = await inspect(page);
              data.overflow = data.sw > data.cw;
              data.pageErrors = pageErrors;
              data.consoleErrors = consoleErrors;
              results.home[width] = data;
              if (data.overflow || data.broken.length || data.missingAlt.length || data.duplicateIds.length || data.h1!==1 || data.unnamedButtons || data.emptyLinks || pageErrors.length || consoleErrors.length || !data.wimpb.length || data.wimpb.some(i=>!i.naturalWidth)) failed = true;
              await page.screenshot({path:`qa-artifacts/home-${width}.png`,fullPage:true});
              if (width===1440 || width===390) {
                const thinking = page.locator('#thinking').first();
                if (await thinking.count()) {
                  await thinking.scrollIntoViewIfNeeded();
                  await sleep(150);
                  await thinking.screenshot({path:`qa-artifacts/wimpb-home-${width}.png`});
                }
              }
              await page.close();

              const casting = await browser.newPage({viewport:{width,height:heights[width]}});
              const castingPageErrors = [];
              const castingConsoleErrors = [];
              casting.on('pageerror', e => castingPageErrors.push(String(e)));
              casting.on('console', m => { if (m.type()==='error') castingConsoleErrors.push(m.text()); });
              await casting.goto('http://127.0.0.1:4173/casting-sheet.html',{waitUntil:'networkidle'});
              await hydratePage(casting);
              const cdata = await inspect(casting);
              cdata.overflow = cdata.sw > cdata.cw;
              cdata.pageErrors = castingPageErrors;
              cdata.consoleErrors = castingConsoleErrors;
              results.casting[width] = cdata;
              if (cdata.overflow || cdata.broken.length || cdata.missingAlt.length || cdata.duplicateIds.length || cdata.h1!==1 || cdata.unnamedButtons || cdata.emptyLinks || castingPageErrors.length || castingConsoleErrors.length || !cdata.wimpb.length || cdata.wimpb.some(i=>!i.naturalWidth)) failed = true;
              if (width===1440 || width===390) {
                const range = casting.locator('.range, #range').first();
                if (await range.count()) {
                  await range.scrollIntoViewIfNeeded();
                  await sleep(150);
                  await range.screenshot({path:`qa-artifacts/wimpb-casting-${width}.png`});
                }
              }
              await casting.close();
            }
            fs.writeFileSync('qa-artifacts/results.json', JSON.stringify(results,null,2));
            await browser.close();
            console.log(JSON.stringify(results,null,2));
            if (failed) process.exit(1);
          })();
          NODE
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/a58-qa.cjs
      - name: Upload QA screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a58-browser-qa
          path: qa-artifacts/
