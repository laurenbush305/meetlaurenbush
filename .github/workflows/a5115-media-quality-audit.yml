name: A5.11.5 Media Quality Audit

on:
  push:
    branches: [main]

jobs:
  media-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chromium and image inspector
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          python -m pip install --quiet pillow
      - name: Audit rendered image density
        run: |
          cat > media-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('qa-artifacts/media-quality',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const pages=[['home','/'],['casting','/casting-sheet.html'],['scrambled','/project-scrambled-up.html'],['pickleball-bag','/project-pickleball-bag.html'],['montis','/project-dear-diary-montis.html'],['centerline','/project-honcho-centerline.html']];
          const all=[];
          for(const [label,path] of pages){
            for(const [mode,width,height,dpr] of [['desktop',1440,1000,2],['mobile',390,844,3]]){
              const ctx=await browser.newContext({viewport:{width,height},deviceScaleFactor:dpr,colorScheme:'light'});
              const page=await ctx.newPage();
              await page.goto(`https://meetlaurenbush.com${path}?qa=media-physical-${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(700);
              await page.evaluate(async()=>{for(let y=0;y<document.documentElement.scrollHeight;y+=Math.max(500,innerHeight*.7)){scrollTo(0,y);await new Promise(r=>setTimeout(r,60));}});
              await page.waitForTimeout(600);
              const rows=await page.evaluate(({label,mode,dpr})=>[...document.images].map((img,i)=>{
                const cs=getComputedStyle(img); const r=img.getBoundingClientRect();
                return {page:label,mode,dpr,i,alt:img.alt,src:img.currentSrc||img.src,content:cs.content,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,renderedWidth:Math.round(r.width),renderedHeight:Math.round(r.height),display:cs.display,visibility:cs.visibility,opacity:cs.opacity};
              }).filter(x=>x.display!=='none'&&x.visibility!=='hidden'&&Number(x.opacity)!==0&&x.renderedWidth>40&&x.renderedHeight>40),{label,mode,dpr});
              all.push(...rows);
              await ctx.close();
            }
          }
          fs.writeFileSync('qa-artifacts/media-quality/browser-observations.json',JSON.stringify(all,null,2));
          await browser.close();
          JS
          node media-audit.mjs

          cat > physical-audit.py <<'PY'
          import json, os, re, urllib.parse
          from PIL import Image
          rows=json.load(open('qa-artifacts/media-quality/browser-observations.json'))
          out=[]
          for x in rows:
              # CSS content:url(...) overrides <img> source on the live Casting operator frame.
              effective=x['src']
              content=x.get('content') or ''
              m=re.search(r'url\(["\']?([^"\')]+)', content)
              if m:
                  effective=m.group(1)
              path=urllib.parse.urlparse(effective).path.lstrip('/')
              if not path.startswith('assets/') or not os.path.exists(path):
                  x['physicalWidth']=None; x['physicalHeight']=None; x['effectiveSource']=effective; x['physicalCoverage']=None
                  out.append(x); continue
              try:
                  with Image.open(path) as im:
                      pw,ph=im.size
              except Exception:
                  pw=ph=None
              x['effectiveSource']=effective
              x['physicalWidth']=pw; x['physicalHeight']=ph
              x['physicalCoverage']=round(pw/(x['renderedWidth']*x['dpr']),2) if pw and x['renderedWidth'] else None
              out.append(x)
          flags=[x for x in out if x.get('physicalCoverage') is not None and x['physicalCoverage']<0.8]
          json.dump(out,open('qa-artifacts/media-quality/all-physical.json','w'),indent=2)
          json.dump(flags,open('qa-artifacts/media-quality/flagged-physical.json','w'),indent=2)
          print(f'Physical-pixel audit: {len(flags)} flags across {len(out)} visible rendered images')
          for x in flags:
              print(x['page'],x['mode'],os.path.basename(urllib.parse.urlparse(x['effectiveSource']).path),f"{x['physicalWidth']}px -> {x['renderedWidth']} CSS px @ {x['dpr']}x = {x['physicalCoverage']} coverage")
          PY
          python physical-audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: a5115-media-quality
          path: qa-artifacts/media-quality
          if-no-files-found: error
