name: A5.10.3 Responsive Deep Media Builder

on:
  push:
    branches: [build/a5103-mobile-network]
    paths:
      - .github/workflows/a5103-deep-media-builder.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deep-media:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/a5103-mobile-network
          fetch-depth: 0

      - name: Install image tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

      - name: Generate same-format responsive derivatives
        run: |
          set -euo pipefail
          mkdir -p assets/img/a5103
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          targets = {
              'assets/img/lauren-black-top.webp': [360, 720, 1080, 1152],
              'assets/img/explain-portrait-wide.jpg': [360, 720, 1080, 1121],
              'assets/img/ecosystem/floral-glasses-approved-exact.jpg': [360, 720, 1068],
              'assets/img/a55/wimpb-campaign-main.jpg': [360, 480],
              'assets/img/a55/finance-intelligence.jpg': [360, 640],
              'assets/img/a3/montis-cut-02.jpg': [360, 720],
              'assets/img/scrambled-host-new.webp': [360, 720, 864],
              'assets/img/scrambled-podium-smile.webp': [360, 720, 864],
              'assets/img/ti-tiny-trap-pilates.jpg': [360, 720, 800],
              'assets/img/host-celsius-main-a52.jpg': [360, 720, 864],
              'assets/img/activate-centerline-wide.jpg': [360, 720, 1080, 1600],
              'assets/img/gotennis-rooftop-atl-a52.jpg': [360, 720, 800],
              'assets/img/apq-poster.jpg': [360, 720],
              'assets/img/montis-poster-wide.jpg': [360, 720, 1080],
              'assets/img/montis-poster.jpg': [360, 720, 1080],
          }

          manifest = {}
          for source, widths in targets.items():
              src = Path(source)
              if not src.exists():
                  raise SystemExit(f'Missing source: {source}')
              stem = src.stem.replace('-approved-exact','')
              ext = src.suffix.lower()
              candidates = []
              for width in widths:
                  out = Path('assets/img/a5103') / f'{stem}-{width}{ext}'
                  cmd = ['convert', str(src), '-auto-orient', '-resize', f'{width}x>', '-strip']
                  if ext in {'.jpg', '.jpeg'}:
                      cmd += ['-interlace', 'Plane', '-sampling-factor', '4:2:0', '-quality', '86']
                  elif ext == '.webp':
                      cmd += ['-quality', '88']
                  cmd.append(str(out))
                  subprocess.run(cmd, check=True)
                  candidates.append((width, str(out)))
              manifest[source] = candidates

          # Emit a shell-readable manifest and a Markdown metrics table.
          rows = ['# A5.10.3 Responsive Deep Media Metrics', '', '| Source / candidate | Bytes | KiB |', '|---|---:|---:|']
          for source, candidates in manifest.items():
              src_size = Path(source).stat().st_size
              rows.append(f'| `{source}` | {src_size:,} | {src_size/1024:.1f} |')
              for width, out in candidates:
                  size = Path(out).stat().st_size
                  rows.append(f'| ↳ `{out}` | {size:,} | {size/1024:.1f} |')
          Path('A5.10.3_DEEP_MEDIA_METRICS.md').write_text('\n'.join(rows) + '\n')

          # Patch every matching <img src="..."> with responsive candidates.
          index = Path('index.html')
          html = index.read_text()
          for source, candidates in manifest.items():
              needle = f'<img src="{source}"'
              if needle not in html:
                  raise SystemExit(f'No <img> source match for {source}; refusing ambiguous patch.')
              srcset = ', '.join(f'{out} {width}w' for width, out in candidates)
              replacement = f'<img src="{source}" srcset="{srcset}" sizes="100vw"'
              html = html.replace(needle, replacement)
          index.write_text(html)
          PY

      - name: Use lighter deferred video poster derivatives
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text()
          swaps = {
              'data-poster="assets/img/a55/wimpb-campaign-main.jpg"': 'data-poster="assets/img/a5103/wimpb-campaign-main-480.jpg"',
              'data-poster="assets/img/montis-poster.jpg"': 'data-poster="assets/img/a5103/montis-poster-720.jpg"',
              'data-poster="assets/img/a55/host-talent.jpg"': 'data-poster="assets/img/a5102/host-talent-540.webp"',
              'data-poster="assets/img/apq-poster.jpg"': 'data-poster="assets/img/a5103/apq-poster-720.jpg"',
          }
          changed = 0
          for old, new in swaps.items():
              if old in html:
                  changed += html.count(old)
                  html = html.replace(old, new)
          if changed < 4:
              raise SystemExit(f'Expected at least 4 deferred poster swaps, changed {changed}.')
          path.write_text(html)
          print(f'Patched {changed} deferred poster references.')
          PY

      - name: Commit responsive deep media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/img/a5103 A5.10.3_DEEP_MEDIA_METRICS.md
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Generate A5.10.3 responsive deep media"
          git push origin HEAD:build/a5103-mobile-network
