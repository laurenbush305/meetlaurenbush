name: A5.10 Project File QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  project-file-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Project file content guard
        run: |
          FILES="casting-sheet.html project-scrambled-up.html project-pickleball-bag.html project-dear-diary-montis.html project-honcho-centerline.html"
          ! grep -Eqi 'review-candidate|YellowSweater|GraffitiFullBody|presenter-rooftop|Bentley|BlackWomenInvest|BlackStool|StudioLeather|FloralDress|Trivia host training|White Claw' $FILES
          for f in project-scrambled-up.html project-pickleball-bag.html project-dear-diary-montis.html project-honcho-centerline.html; do
            grep -Fq 'assets/css/a510-project-files.css' "$f"
            grep -Fq 'mailto:hello@meetlaurenbush.com' "$f"
            ! grep -Eqi '<form[ >]' "$f"
          done
          grep -Fq 'id="selected-files"' casting-sheet.html
          grep -Fq 'project-scrambled-up.html' casting-sheet.html
          grep -Fq 'project-pickleball-bag.html' casting-sheet.html
          grep -Fq 'project-dear-diary-montis.html' casting-sheet.html
          grep -Fq 'project-honcho-centerline.html' casting-sheet.html
      - name: Install browser tooling
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/a510-server.log 2>&1 &
          sleep 2
      - name: Run six-width project gate
        run: |
          mkdir -p qa-a510
          cat > /tmp/a510-qa.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const widths=[1440,1024,768,430,390,360];
          const heights={1440:900,1024:900,768:900,430:932,390:844,360:800};
          const pages=[
            ['casting','casting-sheet.html','.proof-section'],
            ['scrambled','project-scrambled-up.html','.project-hero'],
            ['wimpb','project-pickleball-bag.html','.project-hero'],
            ['montis','project-dear-diary-montis.html','.project-hero'],
            ['centerline','project-honcho-centerline.html','.project-hero']
          ];
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          async function hydrate(page){await page.evaluate(async()=>{const wait=ms=>new Promise(r=>setTimeout(r,ms));[...document.images].forEach(i=>i.loading='eager');for(let y=0;y<document.documentElement.scrollHeight;y+=Math.max(500,Math.floor(innerHeight*.8))){scrollTo(0,y);await wait(35)}scrollTo(0,0);await wait(100);await Promise.all([...document.images].map(i=>i.complete?Promise.resolve():new Promise(resolve=>{i.addEventListener('load',resolve,{once:true});i.addEventListener('error',resolve,{once:true});setTimeout(resolve,2500)})));});}
          (async()=>{const browser=await chromium.launch({headless:true});const out={};let failed=false;for(const [label,path,money] of pages){out[label]={};for(const width of widths){const page=await browser.newPage({viewport:{width,height:heights[width]}});const pageErrors=[],consoleErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});await page.goto(`http://127.0.0.1:4173/${path}`,{waitUntil:'networkidle'});await hydrate(page);const data=await page.evaluate(()=>{const d=document.documentElement;const ids=[...document.querySelectorAll('[id]')].map(e=>e.id);return {overflow:d.scrollWidth>d.clientWidth,broken:[...document.images].filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.getAttribute('src')),missingAlt:[...document.images].filter(i=>!i.hasAttribute('alt')).map(i=>i.getAttribute('src')),duplicateIds:[...new Set(ids.filter((x,i)=>ids.indexOf(x)!==i))],h1:document.querySelectorAll('h1').length,booking:document.querySelectorAll('a[href^="mailto:hello@meetlaurenbush.com"]').length,emptyLinks:[...document.querySelectorAll('a')].filter(a=>!(a.innerText.trim()||a.getAttribute('aria-label'))).length,forms:document.querySelectorAll('form').length,projectCss:!!document.querySelector('link[href="assets/css/a510-project-files.css"]')};});data.pageErrors=pageErrors;data.consoleErrors=consoleErrors;if(data.overflow||data.broken.length||data.missingAlt.length||data.duplicateIds.length||data.h1!==1||data.booking<1||data.emptyLinks||data.forms||pageErrors.length||consoleErrors.length||!data.projectCss)failed=true;out[label][width]=data;await page.screenshot({path:`qa-a510/${label}-${width}.png`,fullPage:true});if(width===1440||width===390){const loc=page.locator(money).first();if(await loc.count()){await loc.scrollIntoViewIfNeeded();await loc.screenshot({path:`qa-a510/${label}-money-${width}.png`})}}await page.close();}}fs.writeFileSync('qa-a510/results.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));await browser.close();if(failed)process.exit(1);})();
          NODE
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/a510-qa.cjs
      - name: Upload A5.10 QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a510-project-file-qa
          path: qa-a510/
