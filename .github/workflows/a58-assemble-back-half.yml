name: A5.8 Assemble Back Half

on:
  push:
    branches: [build/a58-production]
    paths:
      - a58-back-half.fragment.html
      - .github/workflows/a58-assemble-back-half.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/a58-production
          fetch-depth: 0
      - name: Assemble public back half and stylesheet link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          fragment = Path('a58-back-half.fragment.html').read_text()
          text = index.read_text()
          css_link = '<link rel="stylesheet" href="assets/css/lbtv-back-half.css">'
          if css_link not in text:
              anchor = '<link rel="stylesheet" href="assets/css/lbtv-main.css">'
              if anchor not in text:
                  raise SystemExit('Could not find primary stylesheet anchor')
              text = text.replace(anchor, anchor + '\n' + css_link, 1)
          marker = '<section class="gate-end"'
          start = text.find(marker)
          if start < 0:
              marker = '<section class="host on-air"'
              start = text.find(marker)
          if start < 0:
              raise SystemExit('Could not find Gate 01 ending or existing Host section')
          index.write_text(text[:start] + fragment)
          print('assembled index.html from', marker)
          PY
      - name: Commit assembled page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html already assembled."
            exit 0
          fi
          git commit -m "Assemble A5.8 public back half"
          git push origin HEAD:build/a58-production
