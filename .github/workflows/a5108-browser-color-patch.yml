name: A5.10.8 One-Time Browser Color Protection Patch

on:
  push:
    branches:
      - 'fix/a5108-force-light-rendering'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lock public pages against browser auto-dark recoloring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pages = sorted(Path('.').glob('*.html'))
          assert pages, 'No public HTML pages found'
          marker = '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
          protection = '\n'.join([
              '<meta name="color-scheme" content="only light">',
              '<meta name="supported-color-schemes" content="light">',
              '<meta name="darkreader-lock">',
          ])

          changed = []
          for path in pages:
              text = path.read_text()
              if '<meta name="darkreader-lock">' in text:
                  continue
              assert marker in text, f'{path}: viewport marker missing'
              text = text.replace(marker, marker + '\n' + protection, 1)
              path.write_text(text)
              changed.append(str(path))

          css_path = Path('assets/css/a5107-accessible-signal-palette.css')
          css = css_path.read_text()
          if 'color-scheme:only light;' not in css:
              css = css.replace(':root{', ':root{\n  color-scheme:only light;', 1)
              css_path.write_text(css)
              changed.append(str(css_path))

          doc_path = Path('docs/SEASON-ZERO-COLOR-SYSTEM.md')
          doc = doc_path.read_text()
          heading = '## Browser auto-dark protection'
          if heading not in doc:
              doc += '''\n\n## Browser auto-dark protection\n\nThe public site is intentionally art-directed and does not permit third-party/browser auto-dark recoloring. Every root public HTML document must include these declarations in `<head>` before stylesheets:\n\n- `<meta name="color-scheme" content="only light">`\n- `<meta name="supported-color-schemes" content="light">`\n- `<meta name="darkreader-lock">`\n\nThe final palette stylesheet must also declare `color-scheme: only light` on `:root`. This is required because Brave iOS Night Mode uses Dark Reader-style page recoloring that can turn approved light surfaces dark while leaving authored foreground colors unreadable.\n\nThis protection is part of the Season Zero color system. Do not remove it while the site remains light-first and art-directed. Browser chrome may remain dark according to the user's browser settings; the document itself must retain the authored palette.\n'''
              doc_path.write_text(doc)
              changed.append(str(doc_path))

          print('Patched:', ', '.join(changed) if changed else 'nothing; already protected')
          PY

      - name: Commit browser color protection
        run: |
          if git diff --quiet; then
            echo 'No patch changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' assets/css/a5107-accessible-signal-palette.css docs/SEASON-ZERO-COLOR-SYSTEM.md
          git commit -m 'Lock Season Zero against browser auto-dark recoloring'
          git push
