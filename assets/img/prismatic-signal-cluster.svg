<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Season Zero prismatic signal objects</title>
  <desc id="desc">A transparent editorial cluster of faceted glass, iridescent hearts, orbs, stars and crystal fragments.</desc>
  <defs>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6de"/>
      <stop offset=".18" stop-color="#88f4ff"/>
      <stop offset=".38" stop-color="#e19cff"/>
      <stop offset=".57" stop-color="#ff8db7"/>
      <stop offset=".76" stop-color="#ffd584"/>
      <stop offset="1" stop-color="#77dfe4"/>
    </linearGradient>
    <linearGradient id="prism2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ce8ef"/>
      <stop offset=".24" stop-color="#ffffff"/>
      <stop offset=".47" stop-color="#b895ff"/>
      <stop offset=".67" stop-color="#ff78a7"/>
      <stop offset=".86" stop-color="#f9c56b"/>
      <stop offset="1" stop-color="#76e1d9"/>
    </linearGradient>
    <radialGradient id="orb" cx="32%" cy="24%" r="78%">
      <stop offset="0" stop-color="#fff" stop-opacity=".98"/>
      <stop offset=".18" stop-color="#bafcff" stop-opacity=".92"/>
      <stop offset=".48" stop-color="#c49cff" stop-opacity=".82"/>
      <stop offset=".72" stop-color="#ff95bc" stop-opacity=".7"/>
      <stop offset="1" stop-color="#75dbe7" stop-opacity=".42"/>
    </radialGradient>
    <radialGradient id="darkOrb" cx="34%" cy="25%" r="75%">
      <stop offset="0" stop-color="#9ff9ff" stop-opacity=".92"/>
      <stop offset=".14" stop-color="#512a75" stop-opacity=".9"/>
      <stop offset=".42" stop-color="#10141e" stop-opacity=".98"/>
      <stop offset=".66" stop-color="#05060a"/>
      <stop offset=".84" stop-color="#8e4cd8" stop-opacity=".72"/>
      <stop offset="1" stop-color="#43dce4" stop-opacity=".55"/>
    </radialGradient>
    <filter id="shadow" x="-70%" y="-70%" width="240%" height="240%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#24132f" flood-opacity=".2"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- faceted diamond -->
    <g transform="translate(78 186) rotate(-8)">
      <polygon points="0,-42 46,-10 22,42 -30,34 -48,-8" fill="url(#prism)"/>
      <polyline points="0,-42 4,8 46,-10 M4,8 22,42 M4,8 -30,34 M4,8 -48,-8" fill="none" stroke="#fff" stroke-opacity=".62" stroke-width="2"/>
    </g>

    <!-- tiny shard -->
    <g transform="translate(192 92) rotate(18)">
      <polygon points="0,-28 18,0 4,35 -15,3" fill="url(#prism2)"/>
      <path d="M0-28L4 35M-15 3L18 0" stroke="#fff" stroke-opacity=".48" stroke-width="1.4"/>
    </g>

    <!-- iridescent starburst -->
    <g transform="translate(302 212)" filter="url(#glow)">
      <polygon points="0,-42 10,-13 38,-28 20,-3 48,5 18,13 31,39 5,20 -7,49 -15,19 -42,34 -24,8 -51,-2 -21,-11 -35,-38 -8,-20" fill="url(#prism)" opacity=".92"/>
      <circle r="12" fill="#fff" fill-opacity=".7"/>
    </g>

    <!-- jewel heart -->
    <g transform="translate(438 102) rotate(4)">
      <path d="M0 42C-8 28-40 12-40-13C-40-34-14-42 0-23C14-42 40-34 40-13C40 12 8 28 0 42Z" fill="url(#prism2)"/>
      <path d="M0 42V-22M0-22L-25 8M0-22L26 8M-25 8L0 17L26 8" fill="none" stroke="#fff" stroke-opacity=".58" stroke-width="1.5"/>
    </g>

    <!-- pale orb -->
    <g transform="translate(575 214)">
      <circle r="34" fill="url(#orb)"/>
      <ellipse cx="-9" cy="-12" rx="12" ry="7" fill="#fff" fill-opacity=".55" transform="rotate(-20)"/>
    </g>

    <!-- cut glass -->
    <g transform="translate(690 104) rotate(-13)">
      <polygon points="0,-36 33,-17 40,13 12,42 -27,29 -39,-7 -21,-31" fill="url(#prism)"/>
      <path d="M0-36L4 7M33-17L4 7M40 13L4 7M12 42L4 7M-27 29L4 7M-39-7L4 7M-21-31L4 7" stroke="#fff" stroke-opacity=".52" stroke-width="1.4" fill="none"/>
    </g>

    <!-- dark chromatic orb -->
    <g transform="translate(804 226)">
      <circle r="38" fill="url(#darkOrb)"/>
      <circle r="33" fill="none" stroke="url(#prism)" stroke-width="2.2" stroke-opacity=".78"/>
      <path d="M-29 4C-8-17 7-11 29-26M-25 20C-3 5 12 7 33-3" fill="none" stroke="#a7fbff" stroke-opacity=".48" stroke-width="2"/>
    </g>

    <!-- long prism -->
    <g transform="translate(928 108) rotate(12)">
      <polygon points="0,-48 24,-8 8,47 -17,20 -25,-16" fill="url(#prism2)"/>
      <path d="M0-48L-2 8L24-8M-2 8L8 47M-2 8L-17 20M-2 8L-25-16" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.3"/>
    </g>

    <!-- small diamond -->
    <g transform="translate(1036 232) rotate(-4)">
      <polygon points="0,-29 29,0 0,31 -29,0" fill="url(#prism)"/>
      <path d="M0-29V31M-29 0H29" stroke="#fff" stroke-opacity=".64" stroke-width="1.2"/>
    </g>

    <!-- signal star -->
    <g transform="translate(1130 92)" filter="url(#glow)">
      <polygon points="0,-28 7,-8 28,-8 11,4 17,25 0,13 -17,25 -11,4 -28,-8 -7,-8" fill="url(#prism2)"/>
      <circle r="5" fill="#fff"/>
    </g>
  </g>
</svg>